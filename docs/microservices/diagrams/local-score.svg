<svg xmlns="http://www.w3.org/2000/svg" width="960" height="674" viewBox="0 0 960 674" role="img" aria-labelledby="title desc">
<title id="title">Как судья получает подтверждённый счёт</title>
<desc id="desc">Стрелки читаются сверху вниз. Шлюз отвечает судье после записи на двух независимых дисках и фиксации квитанции.</desc>
<style>
:root { --paper:#f5f8f7; --panel:#ffffff; --ink:#182d37; --muted:#445d64; --rule:#bccbc9; --soft:#e5edeb; --line:#426166;
          --gateway:#165173; --journal:#126756; --identity:#654591; --ops:#2456a0; --elo:#995016; --neutral:#3e5961;
          --gateway-soft:#e0f1fa; --journal-soft:#dff2e9; --identity-soft:#eee8f8; --ops-soft:#e5edfc; --elo-soft:#f9ecd9; --neutral-soft:#e8efed; }
  @media (prefers-color-scheme:dark) {
    :root { --paper:#101e24; --panel:#192c32; --ink:#f0f5ef; --muted:#bdcecb; --rule:#53686c; --soft:#263c40; --line:#aec5bf;
            --gateway:#86d4f7; --journal:#77dcc0; --identity:#ccaffa; --ops:#a6c9ff; --elo:#ffc389; --neutral:#c1d3d6;
            --gateway-soft:#203c4b; --journal-soft:#183e35; --identity-soft:#383049; --ops-soft:#263953; --elo-soft:#453627; --neutral-soft:#263b40; }
  }
  text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:var(--ink); }
  .title { font-size:25px; font-weight:700; letter-spacing:-.5px }
  .head { font-size:19px; font-weight:700 }
  .body { font-size:16px }
  .note { font-size:15px; fill:var(--muted) }
  .tag { font-size:14px; font-weight:700; letter-spacing:.4px }
  .base { fill:var(--paper); stroke:var(--rule) }
  .card { fill:var(--panel); stroke:var(--rule) }
  .band { fill:var(--soft) }
  .arrow,.return { fill:none; stroke:var(--line); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#tip) }
  .return { stroke-dasharray:5 5 }
  .spine { fill:none; stroke:var(--line); stroke-width:2; stroke-linejoin:round }
  .guide { stroke:var(--rule); stroke-dasharray:2 5 }
  .divider { stroke:var(--rule) }
</style>
<defs>
  <marker id="tip" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M1 1 L7 4 L1 7 Z" fill="var(--line)"/>
  </marker>
</defs>
<rect x="1" y="1" width="958" height="672" rx="18" class="base"/>
<text x="24" y="42" class="title" text-anchor="start">Как судья получает подтверждённый счёт</text>
<text x="26" y="76" class="tag" text-anchor="start" style="fill:var(--neutral)">Вызов или результат</text>
<rect x="404" y="62" width="102" height="65" rx="12" class="card"/>
<rect x="406" y="64" width="98" height="61" rx="10" fill="var(--neutral-soft)"/>
<rect x="442" y="71" width="26" height="3" rx="2" fill="var(--neutral)"/>
<text x="455" y="98" class="tag" text-anchor="middle" style="fill:var(--neutral)">Судья</text>
<text x="455" y="117" class="note" text-anchor="middle">Клиент</text>
<rect x="509" y="62" width="102" height="65" rx="12" class="card"/>
<rect x="511" y="64" width="98" height="61" rx="10" fill="var(--gateway-soft)"/>
<rect x="547" y="71" width="26" height="3" rx="2" fill="var(--gateway)"/>
<text x="560" y="98" class="tag" text-anchor="middle" style="fill:var(--gateway)">№1 Шлюз</text>
<text x="560" y="117" class="note" text-anchor="middle">Go</text>
<rect x="615" y="62" width="102" height="65" rx="12" class="card"/>
<rect x="617" y="64" width="98" height="61" rx="10" fill="var(--ops-soft)"/>
<rect x="653" y="71" width="26" height="3" rx="2" fill="var(--ops)"/>
<text x="666" y="98" class="tag" text-anchor="middle" style="fill:var(--ops)">Движок</text>
<text x="666" y="117" class="note" text-anchor="middle">Java 25</text>
<rect x="721" y="62" width="102" height="65" rx="12" class="card"/>
<rect x="723" y="64" width="98" height="61" rx="10" fill="var(--journal-soft)"/>
<rect x="759" y="71" width="26" height="3" rx="2" fill="var(--journal)"/>
<text x="772" y="98" class="tag" text-anchor="middle" style="fill:var(--journal)">№2 Диск 1</text>
<text x="772" y="117" class="note" text-anchor="middle">Go / SQLite</text>
<rect x="826" y="62" width="102" height="65" rx="12" class="card"/>
<rect x="828" y="64" width="98" height="61" rx="10" fill="var(--journal-soft)"/>
<rect x="864" y="71" width="26" height="3" rx="2" fill="var(--journal)"/>
<text x="877" y="98" class="tag" text-anchor="middle" style="fill:var(--journal)">№2 Диск 2</text>
<text x="877" y="117" class="note" text-anchor="middle">Go / SQLite</text>
<rect x="23" y="148" width="913" height="30" rx="6" class="band"/>
<text x="36" y="169" class="tag" text-anchor="start">Команда и правила</text>
<path d="M455 180 V285" class="guide"/>
<path d="M560 180 V285" class="guide"/>
<path d="M666 180 V285" class="guide"/>
<path d="M772 180 V285" class="guide"/>
<path d="M877 180 V285" class="guide"/>
<text x="34" y="205" class="body" text-anchor="start">HTTPS/JSON · счёт, ID, ожидаемая версия</text>
<path d="M455 200 H560" class="arrow"/>
<circle cx="455" cy="200" r="3" fill="var(--line)"/>
<text x="34" y="240" class="body" text-anchor="start">HTTP/JSON · проверить по loopback</text>
<path d="M560 235 H666" class="arrow"/>
<circle cx="560" cy="235" r="3" fill="var(--line)"/>
<text x="34" y="275" class="body" text-anchor="start">Событие и изменение сетки</text>
<path d="M666 270 H560" class="return"/>
<circle cx="666" cy="270" r="3" fill="var(--line)"/>
<rect x="23" y="295" width="913" height="30" rx="6" class="band"/>
<text x="36" y="316" class="tag" text-anchor="start">Долговечная запись в клубе</text>
<path d="M455 327 V467" class="guide"/>
<path d="M560 327 V467" class="guide"/>
<path d="M666 327 V467" class="guide"/>
<path d="M772 327 V467" class="guide"/>
<path d="M877 327 V467" class="guide"/>
<text x="34" y="352" class="body" text-anchor="start">HTTPS · записать событие и задание доставки</text>
<path d="M560 347 H772" class="arrow"/>
<circle cx="560" cy="347" r="3" fill="var(--line)"/>
<text x="34" y="387" class="body" text-anchor="start">Событие записано на первый диск</text>
<path d="M772 382 H560" class="return"/>
<circle cx="772" cy="382" r="3" fill="var(--line)"/>
<text x="34" y="422" class="body" text-anchor="start">HTTPS по LAN · передать ID, версию и хеш</text>
<path d="M560 417 H877" class="arrow"/>
<circle cx="560" cy="417" r="3" fill="var(--line)"/>
<text x="34" y="457" class="body" text-anchor="start">Квитанция после записи на второй диск</text>
<path d="M877 452 H560" class="return"/>
<circle cx="877" cy="452" r="3" fill="var(--line)"/>
<rect x="23" y="477" width="913" height="30" rx="6" class="band"/>
<text x="36" y="498" class="tag" text-anchor="start">Публикация локальной версии</text>
<path d="M455 509 V614" class="guide"/>
<path d="M560 509 V614" class="guide"/>
<path d="M666 509 V614" class="guide"/>
<path d="M772 509 V614" class="guide"/>
<path d="M877 509 V614" class="guide"/>
<text x="34" y="534" class="body" text-anchor="start">HTTPS · сохранить квитанцию и версию</text>
<path d="M560 529 H772" class="arrow"/>
<circle cx="560" cy="529" r="3" fill="var(--line)"/>
<text x="34" y="569" class="body" text-anchor="start">Версия зафиксирована</text>
<path d="M772 564 H560" class="return"/>
<circle cx="772" cy="564" r="3" fill="var(--line)"/>
<text x="34" y="604" class="body" text-anchor="start">Ответ судье · принятый счёт и сетка</text>
<path d="M560 599 H455" class="return"/>
<circle cx="560" cy="599" r="3" fill="var(--line)"/>
<path d="M24 627 H936" class="divider"/>
<text x="26" y="653" class="note" text-anchor="start">Сплошная стрелка — вызов, пунктир — ответ. После подтверждения начинается независимая доставка в облако.</text>
</svg>
