<svg xmlns="http://www.w3.org/2000/svg" width="960" height="635" viewBox="0 0 960 635" role="img" aria-labelledby="title desc">
<title id="title">Клуб и три независимые площадки</title>
<desc id="desc">В клубе два устройства. У каждого провайдера свой Swarm и локальная SQLite. Облачный PostgreSQL образует один кластер.</desc>
<style>
:root { --paper:#f5f8f7; --panel:#ffffff; --ink:#182d37; --muted:#445d64; --rule:#bccbc9; --soft:#e5edeb; --line:#426166;
          --gateway:#165173; --journal:#126756; --identity:#654591; --ops:#2456a0; --elo:#995016; --neutral:#3e5961;
          --gateway-soft:#e0f1fa; --journal-soft:#dff2e9; --identity-soft:#eee8f8; --ops-soft:#e5edfc; --elo-soft:#f9ecd9; --neutral-soft:#e8efed; }
  @media (prefers-color-scheme:dark) {
    :root { --paper:#101e24; --panel:#192c32; --ink:#f0f5ef; --muted:#bdcecb; --rule:#53686c; --soft:#263c40; --line:#aec5bf;
            --gateway:#86d4f7; --journal:#77dcc0; --identity:#ccaffa; --ops:#a6c9ff; --elo:#ffc389; --neutral:#c1d3d6;
            --gateway-soft:#203c4b; --journal-soft:#183e35; --identity-soft:#383049; --ops-soft:#263953; --elo-soft:#453627; --neutral-soft:#263b40; }
  }
  text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:var(--ink); }
  .title { font-size:25px; font-weight:700; letter-spacing:-.5px }
  .head { font-size:19px; font-weight:700 }
  .body { font-size:16px }
  .note { font-size:15px; fill:var(--muted) }
  .tag { font-size:14px; font-weight:700; letter-spacing:.4px }
  .base { fill:var(--paper); stroke:var(--rule) }
  .card { fill:var(--panel); stroke:var(--rule) }
  .band { fill:var(--soft) }
  .arrow,.return { fill:none; stroke:var(--line); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#tip) }
  .return { stroke-dasharray:5 5 }
  .spine { fill:none; stroke:var(--line); stroke-width:2; stroke-linejoin:round }
  .guide { stroke:var(--rule); stroke-dasharray:2 5 }
  .divider { stroke:var(--rule) }
</style>
<defs>
  <marker id="tip" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M1 1 L7 4 L1 7 Z" fill="var(--line)"/>
  </marker>
</defs>
<rect x="1" y="1" width="958" height="633" rx="18" class="base"/>
<text x="26" y="42" class="title" text-anchor="start">Размещение в клубе и облаке</text>
<rect x="24" y="69" width="912" height="152" rx="12" class="card"/>
<rect x="26" y="71" width="908" height="148" rx="10" fill="var(--journal-soft)"/>
<text x="43" y="98" class="tag" text-anchor="start" style="fill:var(--journal)">Клуб · подготовленный турнир</text>
<text x="44" y="134" class="head" text-anchor="start">Устройство судьи</text>
<text x="44" y="162" class="body" text-anchor="start">№1 шлюз · №2 протокол и SQLite</text>
<text x="44" y="187" class="note" text-anchor="start">Движок раундов · Java 25</text>
<text x="632" y="134" class="head" text-anchor="start">Второе устройство</text>
<text x="632" y="162" class="body" text-anchor="start">№2 протокол и SQLite</text>
<text x="632" y="187" class="note" text-anchor="start">Независимые диск и питание</text>
<path d="M357 145 H599" class="arrow"/>
<path d="M599 157 H357" class="arrow"/>
<text x="478" y="133" class="tag" text-anchor="middle">HTTPS по LAN</text>
<text x="478" y="182" class="note" text-anchor="middle">Событие и квитанция</text>
<path d="M480 221 V294" class="spine"/>
<rect x="254" y="236" width="452" height="43" rx="7" class="band"/>
<text x="480" y="263" class="body" text-anchor="middle">gRPC ↔ события и квитанции   ·   HTTPS → архив</text>
<path d="M168 294 H792" class="spine"/>
<path d="M168 294 V319" class="return"/>
<g aria-label="Провайдер A">
  <rect x="24" y="324" width="288" height="147" rx="12" class="card"/>
  <rect x="26" y="326" width="284" height="55" rx="10" fill="var(--gateway-soft)"/>
  <rect x="40" y="338" width="30" height="4" rx="2" fill="var(--gateway)"/>
  <text x="40" y="370" class="head" text-anchor="start">Провайдер A · Swarm</text>
  <text x="40" y="400" class="body" text-anchor="start">2 × №1 шлюз · №2 / SQLite</text>
  <text x="40" y="425" class="body" text-anchor="start">№4 Управление турнирами</text>
  <text x="40" y="450" class="note" text-anchor="start">Узел PostgreSQL</text>
</g>
<path d="M480 294 V319" class="return"/>
<g aria-label="Провайдер B">
  <rect x="336" y="324" width="288" height="147" rx="12" class="card"/>
  <rect x="338" y="326" width="284" height="55" rx="10" fill="var(--gateway-soft)"/>
  <rect x="352" y="338" width="30" height="4" rx="2" fill="var(--gateway)"/>
  <text x="352" y="370" class="head" text-anchor="start">Провайдер B · Swarm</text>
  <text x="352" y="400" class="body" text-anchor="start">2 × №1 шлюз · №2 / SQLite</text>
  <text x="352" y="425" class="body" text-anchor="start">№3 Аккаунты · №5 Рейтинг</text>
  <text x="352" y="450" class="note" text-anchor="start">Узел PostgreSQL</text>
</g>
<path d="M792 294 V319" class="return"/>
<g aria-label="Провайдер C">
  <rect x="648" y="324" width="288" height="147" rx="12" class="card"/>
  <rect x="650" y="326" width="284" height="55" rx="10" fill="var(--gateway-soft)"/>
  <rect x="664" y="338" width="30" height="4" rx="2" fill="var(--gateway)"/>
  <text x="664" y="370" class="head" text-anchor="start">Провайдер C · Swarm</text>
  <text x="664" y="400" class="body" text-anchor="start">2 × №1 шлюз · №2 / SQLite</text>
  <text x="664" y="425" class="body" text-anchor="start">Приём событий и чтение</text>
  <text x="664" y="450" class="note" text-anchor="start">Узел PostgreSQL</text>
</g>
<rect x="24" y="497" width="912" height="112" rx="12" class="band"/>
<text x="43" y="527" class="head" text-anchor="start">Доступность площадки по операции</text>
<text x="43" y="555" class="body" text-anchor="start">Табло · читать снимок</text>
<text x="314" y="555" class="body" text-anchor="start">Протокол · принять событие</text>
<text x="626" y="555" class="body" text-anchor="start">Бизнес-запись · PostgreSQL</text>
<text x="43" y="584" class="note" text-anchor="start">При недоступности записи в БД шлюз продолжает направлять зрителей к доступному снимку.</text>
</svg>
