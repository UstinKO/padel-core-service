<!doctype html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${tournament.nombre} + ' · ' + #{rr.results}">Resultados</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/round-robin.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head><body>
<header class="header">
    <div class="container">
        <nav class="navbar">
            <a href="/" class="navbar-brand">
                <img th:src="@{/images/1.svg}" alt="1-Padel Logo" class="navbar-logo" width="40" height="40">
                <span class="navbar-brand-text">1-<span class="brand-highlight">PADEL</span></span>
            </a>
            <button class="navbar-toggler" id="navbarToggler" type="button" aria-label="Menú">
                <span class="navbar-toggler-icon"></span>
                <span class="navbar-toggler-icon"></span>
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="/" class="nav-link"><i class="fas fa-home"></i> <span th:text="#{nav.home}">Inicio</span></a></li>
                    <li class="nav-item" th:if="${isAuthenticated}">
                        <a href="/players/dashboard" class="nav-link" th:text="#{nav.dashboard}">Dashboard</a>
                    </li>
                </ul>
                <div class="navbar-user" th:if="${isAuthenticated}">
                    <span class="user-name">
                        <i class="fas fa-user-circle"></i>
                        <span th:text="${player != null ? player.nombreCompleto : 'Usuario'}">Usuario</span>
                    </span>
                    <form th:action="@{/logout}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-outline-sm">
                            <i class="fas fa-sign-out-alt"></i> <span th:text="#{nav.logout}">Salir</span>
                        </button>
                    </form>
                </div>
                <div class="navbar-user" th:unless="${isAuthenticated}">
                    <a href="/login" class="btn btn-outline-sm">
                        <i class="fas fa-sign-in-alt"></i> <span th:text="#{nav.login}">Iniciar sesión</span>
                    </a>
                </div>
            </div>
        </nav>
    </div>
</header>
<main class="admin-main"><div class="container">
<p><a class="btn btn-outline" th:href="@{'/torneo/' + ${tournament.id}}" th:text="#{team_americano.btn.back}">Назад</a></p>
<h1 th:text="${tournament.nombre}">Турнир</h1>
<p th:text="#{rr.results}">Результаты турнира</p>
<div th:if="${isInitialized}" th:replace="~{fragments/round-robin :: content(false)}"></div>
<p th:unless="${isInitialized}" th:text="#{rr.no_results}">Результаты ещё не сохранены.</p>
</div></main><script th:src="@{/js/main.js}"></script>
</body></html>
