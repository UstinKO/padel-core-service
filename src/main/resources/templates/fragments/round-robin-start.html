<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="start" class="admin-card" style="padding:1.25rem;margin-bottom:1rem">
    <div class="action-help-heading"><h2 th:text="#{rr.title}">Круговой турнир</h2><button th:replace="~{fragments/action-help :: help('rr-overview')}"></button></div>
    <p th:text="#{rr.description}">Каждая постоянная пара играет с каждой один раз.</p>
    <div th:if="${isTeamAmericanoInitialized == true}">
        <p th:text="#{rr.selected}">Проведение уже запущено. Настройки сохранены.</p>
        <a class="btn btn-primary" th:href="@{'/tournaments/team-americano/admin/' + ${tournament.id}}" th:text="#{conduct.resume}">Управление</a><button th:replace="~{fragments/action-help :: help('rr-resume')}"></button>
        <a class="btn btn-outline" th:href="@{'/tournaments/team-americano/' + ${tournament.id}}" th:text="#{tournament.btn.results}">Результаты</a>
    </div>
    <form th:unless="${isTeamAmericanoInitialized == true}" method="post"
          th:action="@{/tournaments/team-americano/initialize}" class="rr-start-form">
        <input type="hidden" name="tournamentId" th:value="${tournament.id}">
        <div style="display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0">
            <div><div class="action-help-field-label"><label for="rr-start-courts" th:text="#{rr.courts}">Корты</label><button th:replace="~{fragments/action-help :: help('rr-courts')}"></button></div><input id="rr-start-courts" class="form-control" type="number" name="courts" min="1" max="10" value="2" required></div>
            <div><div class="action-help-field-label"><label for="rr-start-mode" th:text="#{rr.scoring}">Подсчёт</label><button th:replace="~{fragments/action-help :: help('rr-mode')}"></button></div><select id="rr-start-mode" class="form-control" name="scoringMode" data-rr-mode>
                <option value="POINTS" th:text="#{rr.points}">По очкам</option><option value="SETS" th:text="#{rr.sets}">По сетам</option>
            </select></div>
            <div data-rr-limit><div class="action-help-field-label"><label for="rr-start-limit" th:text="#{rr.limit}">Всего очков за матч</label><button th:replace="~{fragments/action-help :: help('rr-limit')}"></button></div><input id="rr-start-limit" class="form-control" type="number" name="pointsPerMatch" min="1" max="1000" value="32" required></div>
        </div>
        <p th:text="#{rr.set_rule}">Один сет: 6:0–6:5. Места по победам, разнице и выигранным геймам.</p>
        <button class="btn btn-primary" type="submit" th:text="#{rr.start}">Запустить круговой турнир</button><button th:replace="~{fragments/action-help :: help('rr-start')}"></button>
    </form>
    <script>
        document.querySelectorAll('[data-rr-mode]').forEach(select => select.addEventListener('change', () => {
            const field = select.form.querySelector('[data-rr-limit]');
            field.hidden = select.value === 'SETS';
            field.querySelector('input').required = select.value === 'POINTS';
        }));
    </script>
</section>
</body></html>
