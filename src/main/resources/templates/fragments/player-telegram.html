<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<section th:fragment="profile" th:if="${@environment.getProperty('telegram.players.enabled') == 'true'}"
         class="telegram-panel" data-tg-profile hidden
         th:attr="data-loading=#{telegram.ui.loading},data-error=#{telegram.ui.error},data-unavailable=#{telegram.ui.unavailable},data-connected=#{telegram.ui.connected},data-disconnected=#{telegram.ui.disconnected},data-open-hint=#{telegram.ui.openHint},data-whatsapp-saved=#{telegram.ui.whatsappSaved}">
    <h2 th:text="#{telegram.ui.title}"></h2>
    <p th:text="#{telegram.ui.description}"></p>
    <p data-tg-status role="status" aria-live="polite" th:text="#{telegram.ui.loading}"></p>
    <div class="telegram-actions">
        <button type="button" class="btn btn-primary" data-tg-connect disabled th:text="#{telegram.ui.connect}"></button>
        <a class="btn btn-primary" data-tg-open target="_blank" rel="noopener noreferrer" hidden th:text="#{telegram.ui.open}"></a>
        <button type="button" class="btn btn-outline" data-tg-disconnect hidden th:text="#{telegram.ui.disconnect}"></button>
        <button type="button" class="btn btn-outline" data-tg-refresh th:text="#{telegram.ui.refresh}"></button>
    </div>
    <div class="telegram-preference">
        <label><span th:text="#{telegram.ui.preference}"></span>
            <select data-tg-preference>
                <option value="UNSPECIFIED" th:text="#{telegram.ui.preferenceNone}"></option>
                <option value="TELEGRAM">Telegram</option>
                <option value="WHATSAPP">WhatsApp</option>
            </select>
        </label>
        <button type="button" class="btn btn-outline" data-tg-save-preference th:text="#{telegram.ui.savePreference}"></button>
    </div>
    <p class="telegram-note" th:text="#{telegram.ui.preferenceHint}"></p>
</section>
<template th:fragment="registration" th:if="${@environment.getProperty('telegram.players.enabled') == 'true'}" data-tg-prompt-template>
    <section class="telegram-registration" data-tg-prompt
             th:attr="data-loading=#{telegram.ui.loading},data-error=#{telegram.ui.error},data-unavailable=#{telegram.ui.unavailable},data-connected=#{telegram.ui.connected},data-disconnected=#{telegram.ui.promptOptional},data-open-hint=#{telegram.ui.openHint},data-whatsapp-saved=#{telegram.ui.whatsappSaved},data-prompt-title=#{telegram.ui.promptTitle},data-whatsapp-title=#{telegram.ui.whatsappTitle},data-connected-title=#{telegram.ui.connectedTitle}">
        <h3 data-tg-title th:text="#{telegram.ui.promptTitle}"></h3>
        <p data-tg-offer th:text="#{telegram.ui.promptDescription}"></p>
        <p data-tg-status role="status" aria-live="polite"></p>
        <div class="telegram-actions">
            <button type="button" class="btn btn-primary" data-tg-connect th:text="#{telegram.ui.connect}"></button>
            <a class="btn btn-primary" data-tg-open target="_blank" rel="noopener noreferrer" hidden th:text="#{telegram.ui.open}"></a>
            <button type="button" class="btn btn-outline" data-tg-whatsapp th:text="#{telegram.ui.useWhatsapp}"></button>
            <button type="button" class="btn btn-outline" data-tg-refresh hidden th:text="#{telegram.ui.refresh}"></button>
        </div>
        <a th:href="@{/perfil}" data-tg-profile-link hidden th:text="#{telegram.ui.changePreference}"></a>
    </section>
</template>
<section th:fragment="admin" th:if="${@playerTelegramAccess.allowsEvent(tournament.id)}"
         class="telegram-panel" data-tg-admin
         th:attr="data-tournament-id=${tournament.id},data-loading=#{telegram.ui.loading},data-error=#{telegram.ui.error},data-sent=#{telegram.ui.requestSent},data-summary-sent=#{telegram.ui.summarySent},data-confirmed=#{telegram.ui.confirmed},data-pending=#{telegram.ui.pending},data-not-required=#{telegram.ui.notRequired},data-declined=#{telegram.ui.declined},data-no-telegram=#{telegram.ui.noTelegram},data-delivery-error=#{telegram.ui.deliveryError},data-whatsapp-manual=#{telegram.ui.whatsappManual},data-manual-contact=#{telegram.ui.manualContact}">
    <details class="telegram-disclosure" data-tg-disclosure
             th:attr="data-preference-user-id=${#authentication.principal.id}">
        <summary class="telegram-disclosure-heading">
            <h2 th:text="#{telegram.ui.adminTitle}"></h2>
            <span class="telegram-disclosure-action">
                <span class="telegram-disclosure-arrow" aria-hidden="true"></span>
                <span class="telegram-disclosure-expand" th:text="#{telegram.ui.expand}"></span>
                <span class="telegram-disclosure-collapse" th:text="#{telegram.ui.collapse}"></span>
            </span>
            <span class="telegram-counters">
                <span><strong data-tg-total>0</strong> <span th:text="#{telegram.ui.total}"></span></span>
                <span><strong data-tg-confirmed>0</strong> <span th:text="#{telegram.ui.confirmed}"></span></span>
                <span><strong data-tg-pending>0</strong> <span th:text="#{telegram.ui.pending}"></span></span>
                <span><strong data-tg-missing>0</strong> <span th:text="#{telegram.ui.noTelegram}"></span></span>
            </span>
        </summary>
        <div class="telegram-disclosure-content">
            <p th:text="#{telegram.ui.adminDescription}"></p>
            <div class="telegram-actions">
                <button type="button" class="btn btn-primary" data-tg-request th:text="#{telegram.ui.request}"></button>
                <button type="button" class="btn btn-outline" data-tg-refresh th:text="#{telegram.ui.refresh}"></button>
                <button sec:authorize="hasRole('SUPER_ADMIN')" type="button" class="btn btn-outline" data-tg-summary th:text="#{telegram.ui.summary}"></button>
            </div>
            <ul class="telegram-participants" data-tg-participants></ul>
        </div>
    </details>
    <p data-tg-status role="status" aria-live="polite" th:text="#{telegram.ui.loading}"></p>
</section>
<th:block th:fragment="assets" th:if="${@environment.getProperty('telegram.players.enabled') == 'true'}">
    <link rel="stylesheet" th:href="@{/css/player-telegram.css}">
    <script th:src="@{/js/player-telegram.js}" defer></script>
</th:block>
</body>
</html>
