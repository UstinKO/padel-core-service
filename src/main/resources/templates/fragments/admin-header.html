<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="app-profile" th:content="${@environment.getActiveProfiles().length > 0
        ? @environment.getActiveProfiles()[0]
        : 'default'}">
    <meta charset="UTF-8">
    <meta name="app-profile">
</head>
<body>
<!-- Фрагмент заголовка для админ-панели.
     th:block оборачивает header+скрипты вместе — th:fragment на самом <header>
     захватывал бы только этот тег, а скрипты после него никогда бы не попали
     в вызывающую страницу (issue #198: admin-menu.js/logger.js/t.js молча
     никогда не рендерились ни на одной admin-странице). -->
<th:block th:fragment="header(pageTitle)">
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="/admin" class="navbar-brand">
                    <img th:src="@{/images/1.svg}" alt="1-Padel Logo" class="navbar-logo" width="40" height="40">
                    <span class="navbar-brand-text">1-<span class="brand-highlight">PADEL</span> ADMIN</span>
                </a>

                <!-- КНОПКА БУРГЕР-МЕНЮ ДЛЯ МОБИЛЬНЫХ -->
                <button class="navbar-toggler" id="navbarToggler" type="button" aria-label="Menú">
                    <span class="navbar-toggler-icon"></span>
                    <span class="navbar-toggler-icon"></span>
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- НАВИГАЦИЯ - теперь с ID для бургер-меню -->
                <div class="navbar-collapse" id="navbarNav">
                    <div class="navbar-menu" style="flex: 1; justify-content: center;">
                        <a href="/" class="btn btn-outline btn-sm">
                            <i class="fas fa-home"></i> <span th:text="#{admin.nav.home}">Inicio</span>
                        </a>
                        <a href="/admin/clubs" class="btn btn-outline btn-sm">
                            <i class="fas fa-building"></i> <span th:text="#{admin.nav.clubs}">Clubes</span>
                        </a>
                        <a href="/admin/tournaments" class="btn btn-outline btn-sm">
                            <i class="fas fa-trophy"></i> <span th:text="#{admin.nav.tournaments}">Torneos</span>
                        </a>
                        <a href="/admin/players" class="btn btn-outline btn-sm">
                            <i class="fas fa-users"></i> <span th:text="#{admin.nav.players}">Jugadores</span>
                        </a>
                    </div>

                    <!-- Приветствие и выход -->
                    <div class="navbar-menu">
                        <span class="user-greeting" th:text="#{admin.nav.greeting}">Hola, Admin!</span>
                        <form th:action="@{/logout}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-outline">
                                <i class="fas fa-sign-out-alt"></i> <span th:text="#{admin.nav.logout}">Salir</span>
                            </button>
                        </form>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <script th:src="@{/js/logger.js}"></script>
    <script th:src="${'/js/i18n/messages-' + #locale.language + '.js'}"></script>
    <script th:src="@{/js/i18n/t.js}"></script>
    <script th:src="@{/js/admin-menu.js}"></script>
</th:block>
</body>
</html>
