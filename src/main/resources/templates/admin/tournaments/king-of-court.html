<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="app-profile" th:content="${@environment.getActiveProfiles().length > 0
        ? @environment.getActiveProfiles()[0]
        : 'default'}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'King of Court - ' + ${tournament.nombre}">King of Court</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/2.svg}">
    <link rel="alternate icon" th:href="@{/images/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">

    <!-- Custom Styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/king-of-court.css}">
</head>
<body>
<header th:replace="~{fragments/admin-header :: header(#{admin.koc.title})}"></header>

<main class="admin-main">
    <div class="container">
        <!-- Mensajes de éxito/error -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}">Operación exitosa</span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}">Error en la operación</span>
        </div>

        <!-- Cabecera con información del torneo -->
        <div class="admin-header">
            <h1 class="admin-title">
                <i class="fas fa-crown" style="color: #fbbf24;"></i>
                <span th:text="${tournament.nombre}">Torneo</span>
            </h1>
            <div class="admin-subtitle">
                <span class="badge" th:text="#{admin.koc.round.label} + ' ' + ${kingTournament.currentRound}">Ronda 1</span>
                <span class="badge badge-level"
                      th:text="${kingTournament.currentRound <= kingTournament.calibrationRounds} ? #{admin.koc.round.calibration} : #{admin.koc.round.bonus}"
                      th:classappend="${kingTournament.currentRound <= kingTournament.calibrationRounds} ? 'badge-warning' : 'badge-success'">
                        Calibración
                    </span>
                <span class="badge" th:text="${kingTournament.isFinished} ? #{admin.koc.status.finished} : #{admin.koc.status.active}"
                      th:classappend="${kingTournament.isFinished} ? 'badge-danger' : 'badge-success'">
                        Activo
                    </span>
            </div>
        </div>

        <!-- Enlace de YouTube (solo para admin) -->
        <div class="admin-card" th:if="${admin}">
            <div class="admin-card-header">
                <h2><i class="fab fa-youtube" style="color: #ff0000;"></i> <span th:text="#{admin.koc.section.youtube}">Transmisión en vivo</span></h2>
            </div>
            <div class="admin-card-body">
                <div class="youtube-link-form" style="display: flex; gap: 1rem;">
                    <input type="text" id="youtubeLink" class="form-control"
                           th:placeholder="#{admin.koc.youtube.placeholder}"
                           placeholder="Ingrese el enlace de YouTube"
                           th:value="${kingTournament.youtubeLink}">
                    <button class="btn btn-primary" onclick="window.kingOfCourt?.saveYoutubeLink()">
                        <i class="fas fa-save"></i> <span th:text="#{admin.koc.youtube.save}">Guardar</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Información de torneo finalizado -->
        <div th:if="${kingTournament.isFinished}" class="admin-card" style="text-align: center; padding: 2rem;">
            <i class="fas fa-trophy" style="font-size: 4rem; color: #fbbf24; margin-bottom: 1rem;"></i>
            <h2 th:text="#{admin.koc.finished.title}">¡Torneo finalizado!</h2>
            <p th:text="#{admin.koc.finished.text}">La clasificación final está disponible a continuación</p>
        </div>

        <!-- Grid de canchas -->
        <div class="admin-card">
            <div class="admin-card-header">
                <h2><i class="fas fa-map-marked-alt"></i> <span th:text="#{admin.koc.section.courts}">Canchas</span></h2>
                <span class="badge" th:text="${state.allResultsIn} ? #{admin.koc.badge.results_in} : #{admin.koc.badge.waiting}"
                      th:classappend="${state.allResultsIn} ? 'badge-success' : 'badge-warning'">
                    </span>
            </div>
            <div class="admin-card-body">
                <div id="courtsContainer" class="courts-grid">
                    <!-- Carga dinámica via JavaScript -->
                </div>
            </div>
        </div>

        <!-- Ranking e historial en dos columnas -->
        <div class="admin-grid-two" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem;">
            <!-- Ranking en vivo -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2><i class="fas fa-chart-line"></i> <span th:text="#{admin.koc.section.ranking}">Clasificación en vivo</span></h2>
                    <a href="#" onclick="window.kingOfCourt?.loadData()" class="btn-icon" title="Actualizar">
                        <i class="fas fa-sync-alt"></i>
                    </a>
                </div>
                <div class="admin-card-body">
                    <table class="admin-table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th th:text="#{admin.koc.col.player}">Jugador</th>
                            <th th:text="#{admin.koc.col.points}">Puntos</th>
                            <th th:text="#{admin.koc.col.bonuses}">Bonos</th>
                            <th th:text="#{admin.koc.col.games}">Juegos</th>
                            <th th:text="#{admin.koc.col.wins_losses}">V/D</th>
                        </tr>
                        </thead>
                        <tbody id="leaderboard">
                        <!-- Carga dinámica via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Historial de partidos -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2><i class="fas fa-history"></i> <span th:text="#{admin.koc.section.history}">Historial de partidos</span></h2>
                </div>
                <div class="admin-card-body">
                    <ul id="matchHistory" class="history-list" style="list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto;">
                        <!-- Carga dinámica via JavaScript -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Кнопка шаринга — всегда видна -->
        <div class="admin-actions" style="justify-content: center; margin-top: 1.5rem;">
            <button onclick="shareAdminTournament()"
                    class="btn btn-outline"
                    style="display:flex; align-items:center; gap:.5rem;">
                <i class="fas fa-share-alt"></i> <span th:text="#{admin.koc.btn.share}">Compartir torneo</span>
            </button>
        </div>

        <!-- Botones de administrador -->
        <div class="admin-actions" style="justify-content: center; margin-top: 2rem; gap: 1rem; display: flex; flex-wrap: wrap;"
             th:if="${admin and not kingTournament.isFinished}">

            <!-- Следующий раунд — показывается JS когда все результаты введены -->
            <button id="nextRoundBtn" class="btn btn-primary" style="display: none;">
                <i class="fas fa-forward"></i> <span th:text="#{admin.koc.btn.next_round_start}">Iniciar siguiente ronda</span>
            </button>

            <!-- Откатить раунд — показывается JS когда currentRound > 1 -->
            <button id="rollbackRoundBtn" class="btn btn-warning" style="display: none;"
                    onclick="window.kingOfCourt?.rollbackRound()">
                <i class="fas fa-undo"></i> <span th:text="#{admin.koc.btn.rollback_round}">Cancelar último avance</span>
            </button>

            <!-- Завершить турнир -->
            <button id="endTournamentBtn" class="btn btn-danger" style="display: none;"
                    onclick="window.kingOfCourt?.endTournament()">
                <i class="fas fa-flag-checkered"></i> <span th:text="#{admin.koc.btn.end}">Finalizar torneo</span>
            </button>
        </div>

        <!-- Кнопка сброса — отдельный блок, всегда видна администратору -->
        <div th:if="${admin and not kingTournament.isFinished}"
             style="display:flex; justify-content:center; margin-top:1rem;">
            <form th:action="@{'/admin/tournaments/king-of-court/' + ${kingTournament.id} + '/reset'}"
                  method="post"
                  id="resetTournamentForm">
                <button type="button"
                        class="btn btn-outline"
                        style="border-color:#dc2626; color:#dc2626; gap:.5rem; display:flex; align-items:center;"
                        onclick="confirmReset()">
                    <i class="fas fa-redo-alt"></i> <span th:text="#{admin.koc.btn.reset}">Reiniciar torneo</span>
                </button>
            </form>
        </div>

        <!-- Botón de volver (si está finalizado) -->
        <div class="admin-actions" style="justify-content: center; margin-top: 2rem;" th:if="${kingTournament.isFinished}">
            <a th:href="@{'/admin/tournaments/' + ${tournament.id}}" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> <span th:text="#{admin.koc.btn.back}">Volver al torneo</span>
            </a>
        </div>
    </div>
</main>

<!-- Fragmentos de modales -->
<div th:replace="~{fragments/king-of-court-modals :: resultModal}"></div>
<div th:replace="~{fragments/king-of-court-modals :: historyModal}"></div>
<div th:replace="~{fragments/king-of-court-modals :: finalResultsModal}"></div>

<footer th:replace="~{fragments/admin-footer :: footer}"></footer>
<script th:src="@{/js/logger.js}"></script>
<script th:src="@{/js/csrf.js}"></script>
<script th:src="${'/js/i18n/messages-' + #locale.language + '.js'}"></script>
<script th:src="@{/js/i18n/t.js}"></script>
<!-- WebSocket libraries -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<!-- Datos para JavaScript -->
<script th:inline="javascript">
    /*<![CDATA[*/
    window.tournamentData = {
        kingId: [[${kingTournament.id}]],
        tournamentId: [[${tournament.id}]],
        currentRound: [[${kingTournament.currentRound}]],
        calibrationRounds: [[${kingTournament.calibrationRounds}]],
        maxCourts: [[${kingTournament.maxCourts}]],
        isAdmin: [[${admin}]],
        isFinished: [[${kingTournament.isFinished}]],
        youtubeLink: [[${kingTournament.youtubeLink}]]
    };
    /*]]>*/
</script>

<script th:src="@{/js/king-of-court.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    function shareAdminTournament() {
        const kingId = /*[[${kingTournament.id}]]*/ 0;
        const tournamentName = /*[[${tournament.nombre}]]*/ 'Torneo';
        const publicUrl = window.location.origin + '/tournaments/king-of-court/' + kingId;
        showSharePanel(tournamentName, publicUrl);
    }
    /*]]>*/
</script>
<script th:src="@{/js/share-panel.js}"></script>
<script>
    function confirmReset() {
        const first = confirm(
            '⚠️ REINICIAR TORNEO\n\n' +
            'Esto eliminará:\n' +
            '• Todos los raundas y resultados\n' +
            '• Distribución de canchas\n' +
            '• Estadísticas de jugadores\n\n' +
            'Los jugadores CONFIRMADOS quedan intactos.\n' +
            'Podrás modificar el plantel y volver a iniciar.\n\n' +
            '¿Continuar?'
        );
        if (!first) return;

        const second = confirm(
            '¿Estás seguro?\n\nEsta acción NO se puede deshacer.'
        );
        if (!second) return;

        document.getElementById('resetTournamentForm').submit();
    }
</script>
</body>
</html>
