<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{telegram.compose.title}"></title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/telegram-messages.css}">
    <script th:src="@{/js/csrf.js}" defer></script>
    <script th:src="@{/js/telegram-messages.js}" defer></script>
    <script th:src="@{/js/telegram-invitation.js}" defer></script>
    <th:block th:if="${#strings.isEmpty(audienceTournamentId)}" th:replace="~{fragments/telegram-connections :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/admin-header :: header(#{telegram.compose.title})}"></header>
<main class="admin-main tg-compose" data-message-composer th:attr="data-tournament-id=${audienceTournamentId}">
    <div hidden data-compose-strings>
        <span th:each="key : ${#strings.arraySplit('loading,error,sessionExpired,sessionExpiredShort,stale,empty,selected,ready,unavailable,AVAILABLE,NOT_CONNECTED,WHATSAPP,GUEST,INACTIVE,OUTSIDE_PILOT,DISABLED,ALL,MAIN,RESERVE,UNPAIRED,PENDING', ',')}"
              th:attr="data-key=${key}" th:text="${#messages.msg('telegram.compose.' + key)}"></span>
    </div>
    <div hidden data-campaign-strings><span th:each="key : ${#strings.arraySplit('test,send,history,sentMeaning,previous,next,confirmTitle,confirm,cancel,close,details,retry,explanation,confirmHint,queued,uncertain,previewUnavailable,sendDisabled,testUnavailable,confirmSend,confirmRetry,DRAFT,QUEUED,FINISHED,MESSAGE,TEST,PENDING,IN_FLIGHT,SENT,FAILED,BLOCKED,UNKNOWN,SKIPPED,PROVIDER_REJECTED,ACCESS_CHANGED,REGISTRATION_CHANGED,EVENT_UNAVAILABLE,CONNECTION_CHANGED,TEST_UNAVAILABLE,UNCERTAIN,RECOVERED', ',')}" th:attr="data-key=${key}" th:text="${#messages.msg('telegram.campaign.' + key)}"></span></div>
    <a th:href="${#strings.isEmpty(audienceTournamentId)} ? @{/admin} : @{/admin/tournaments/{id}/payments(id=${audienceTournamentId})}"
       th:text="#{telegram.compose.back}"></a>
    <h1 th:text="#{telegram.compose.title}"></h1>
    <th:block th:if="${#strings.isEmpty(audienceTournamentId)}"><section th:replace="~{fragments/telegram-connections :: statistics}"></section></th:block>
    <section class="tg-compose-panel" data-telegram-invitation hidden
             th:attr="data-copied=#{telegram.connect.copied},data-manual=#{telegram.connect.manual}">
        <h2 th:text="#{telegram.connect.inviteTitle}"></h2>
        <p th:text="#{telegram.connect.inviteHint}"></p>
        <label for="tg-invitation-url" th:text="#{telegram.connect.inviteLabel}"></label>
        <input id="tg-invitation-url" type="text" readonly autocomplete="off">
        <div class="tg-compose-actions"><button class="btn btn-outline" type="button" th:text="#{telegram.connect.copy}"></button></div>
        <p role="status" aria-live="polite"></p>
    </section>
    <p data-event-name></p>
    <p class="tg-compose-note" th:text="#{telegram.compose.notice}"></p>
    <section data-session-warning hidden class="tg-compose-note" role="alert">
        <p th:text="#{telegram.compose.sessionExpired}"></p>
        <div class="tg-compose-actions">
            <a class="btn btn-outline" data-session-login target="_blank" rel="noopener"
               th:href="${#strings.isEmpty(audienceTournamentId)} ? @{/admin/telegram/messages} : @{/admin/tournaments/{id}/telegram/messages(id=${audienceTournamentId})}"
               th:text="#{telegram.compose.sessionLogin}"></a>
            <button type="button" class="btn btn-outline" data-session-refresh th:text="#{telegram.compose.sessionRefresh}"></button>
        </div>
    </section>
    <p data-compose-status role="status" aria-live="polite"></p>
    <div class="tg-compose-layout">
        <section class="tg-compose-panel" th:aria-label="#{telegram.compose.audience}">
            <h2 th:text="#{telegram.compose.audience}"></h2>
            <p data-scope-hint th:text="#{telegram.compose.scope}"></p>
            <fieldset><legend th:text="#{telegram.compose.groups}"></legend><div data-groups class="tg-compose-options"></div></fieldset>
            <fieldset><legend th:text="#{telegram.compose.categories}"></legend><div data-categories class="tg-compose-options"></div></fieldset>
            <label for="tg-person-search" th:text="#{telegram.compose.search}"></label>
            <input id="tg-person-search" type="search" data-person-search autocomplete="off">
            <div class="tg-compose-actions">
                <button type="button" class="btn btn-outline" data-reset th:text="#{telegram.compose.reset}"></button>
                <button type="button" class="btn btn-outline" data-refresh th:text="#{telegram.compose.refresh}"></button>
            </div>
            <p data-selection-count aria-live="polite"></p>
            <div data-candidates class="tg-compose-candidates"></div>
        </section>
        <section class="tg-compose-panel" th:aria-label="#{telegram.compose.message}">
            <h2 th:text="#{telegram.compose.message}"></h2>
            <label for="tg-message-text" th:text="#{telegram.compose.text}"></label>
            <textarea id="tg-message-text" data-message-text rows="8" maxlength="4096" required></textarea>
            <p><span data-text-length>0</span> / 4096</p>
            <button type="button" class="btn btn-primary" data-preview disabled th:text="#{telegram.compose.preview}"></button>
            <section data-preview-result hidden tabindex="-1" th:aria-label="#{telegram.compose.result}">
                <h2 th:text="#{telegram.compose.result}"></h2>
                <p class="tg-compose-message" data-preview-text></p>
                <h3 th:text="#{telegram.compose.ready}"></h3><ul data-ready-list></ul>
                <h3 th:text="#{telegram.compose.unavailable}"></h3><ul data-unavailable-list></ul>
                <p class="tg-compose-note" th:text="#{telegram.campaign.explanation}"></p>
                <p data-send-hint role="status"></p>
                <div class="tg-compose-actions">
                    <button type="button" class="btn btn-outline" data-test disabled th:text="#{telegram.campaign.test}"></button>
                    <button type="button" class="btn btn-primary" data-send disabled th:text="#{telegram.campaign.send}"></button>
                </div>
            </section>
        </section>
    </div>
    <section class="tg-compose-panel tg-campaign-history">
        <h2 th:text="#{telegram.campaign.history}"></h2>
        <p th:text="#{telegram.campaign.sentMeaning}"></p>
        <button type="button" class="btn btn-outline" data-history-refresh th:text="#{telegram.compose.refresh}"></button>
        <p data-history-status role="status"></p><div data-history-list></div>
        <div class="tg-compose-actions">
            <button type="button" class="btn btn-outline" data-history-previous th:text="#{telegram.campaign.previous}"></button>
            <button type="button" class="btn btn-outline" data-history-next th:text="#{telegram.campaign.next}"></button>
        </div>
    </section>
    <dialog data-send-dialog th:aria-label="#{telegram.campaign.confirmTitle}">
        <h2 th:text="#{telegram.campaign.confirmTitle}"></h2>
        <p data-confirm-summary></p><p data-confirm-text class="tg-compose-message"></p><ul data-confirm-people></ul>
        <p th:text="#{telegram.campaign.confirmHint}"></p>
        <div class="tg-compose-actions">
            <button type="button" class="btn btn-primary" data-confirm-submit th:text="#{telegram.campaign.confirm}"></button>
            <button type="button" class="btn btn-outline" data-confirm-cancel th:text="#{telegram.campaign.cancel}"></button>
        </div>
    </dialog>
    <dialog data-history-dialog th:aria-label="#{telegram.campaign.details}">
        <h2 th:text="#{telegram.campaign.details}"></h2>
        <button type="button" class="btn btn-outline" data-history-close th:text="#{telegram.campaign.close}"></button>
        <p data-history-meta></p><p data-history-text class="tg-compose-message"></p><ul data-history-people></ul>
        <button type="button" class="btn btn-primary" data-history-retry hidden th:text="#{telegram.campaign.retry}"></button>
    </dialog>
</main>
<footer th:replace="~{fragments/admin-footer :: footer}"></footer>
</body>
</html>
