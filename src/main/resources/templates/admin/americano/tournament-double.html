<!doctype html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${@eventLevelText.eventName(tournament.nombre, #locale)} + ' · ' + #{rr.title}">Round Robin</title>
<link rel="icon" type="image/svg+xml" th:href="@{/images/2.svg}">
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/round-robin.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head><body>
<header th:replace="~{fragments/admin-header :: header(#{rr.title})}"></header>
<main class="admin-main"><div class="container">
<div th:replace="~{fragments/conduct-history :: link(${tournament.id})}"></div>
<div th:replace="~{fragments/conduct-history :: saveStatus}"></div>
<p><a class="btn btn-outline" th:href="@{'/admin/tournaments/' + ${tournament.id}}" th:text="#{admin.americano.btn.back_to_details}">Назад</a></p>
<h1 th:text="${@eventLevelText.eventName(tournament.nombre, #locale)}">Турнир</h1>
<div th:if="${success}" role="status" class="alert alert-success" th:text="#{rr.saved}">Сохранено</div>
<div th:if="${error}" role="alert" class="alert alert-danger" th:text="#{rr.save_error}">Проверьте данные</div>
<div th:if="${isInitialized}" th:replace="~{fragments/round-robin :: content(true)}"></div>
<p th:unless="${isInitialized}" th:text="#{rr.not_started}">Выберите проведение и запустите его в карточке мероприятия.</p>
</div></main>
<script th:src="@{/js/csrf.js}"></script><script th:src="@{/js/tournament-conduct.js}"></script><script th:src="@{/js/round-robin.js}"></script>
</body></html>
