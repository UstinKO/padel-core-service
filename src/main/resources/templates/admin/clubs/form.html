<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${club.id == null} ? #{admin.clubs.form.title.create} + ' - 1-Padel Admin' : #{admin.clubs.form.title.edit} + ' - 1-Padel Admin'">Crear Club - 1-Padel Admin</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/2.svg}">
    <link rel="alternate icon" th:href="@{/images/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-forms.css}">
</head>
<body>
<header th:replace="~{fragments/admin-header :: header(${club.id == null} ? #{admin.clubs.form.title.create} : #{admin.clubs.form.title.edit})}"></header>

<main class="admin-main">
    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <h1 th:if="${club.id == null}">
                    <i class="fas fa-plus-circle"></i>
                    <span th:text="#{admin.clubs.form.title.create}">Crear Nuevo Club</span>
                </h1>
                <h1 th:unless="${club.id == null}">
                    <i class="fas fa-edit"></i>
                    <span th:text="#{admin.clubs.form.title.edit}">Editar Club</span>
                </h1>
                <p th:text="#{admin.clubs.form.subtitle}">Complete los detalles del club a continuación</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMessage}">Error en la operación</span>
            </div>

            <form th:action="@{${club.id == null ? '/admin/clubs' : '/admin/clubs/' + club.id + '/edit'}}"
                  th:object="${club}"
                  method="post"
                  class="club-form"
                  id="clubForm">

                <input type="hidden" th:if="${club.id != null}" name="_method" value="put" />

                <!-- Información Básica -->
                <div class="form-section">
                    <h2 class="section-title">
                        <i class="fas fa-info-circle"></i>
                        <span th:text="#{admin.clubs.form.section.basic}">Información Básica</span>
                    </h2>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nombre" class="required" th:text="#{admin.clubs.form.field.name}">Nombre del Club</label>
                            <input type="text"
                                   th:field="*{nombre}"
                                   id="nombre"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                   th:placeholder="#{admin.clubs.form.placeholder.name}"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}">Error en el campo</div>
                        </div>

                        <div class="form-group">
                            <label for="zonaCiudad" th:text="#{admin.clubs.form.field.city_zone}">Ciudad / Zona</label>
                            <input type="text"
                                   th:field="*{zonaCiudad}"
                                   id="zonaCiudad"
                                   class="form-control"
                                   th:placeholder="#{admin.clubs.form.placeholder.city_zone}">
                        </div>

                        <div class="form-group">
                            <label for="direccion" th:text="#{admin.clubs.form.field.address}">Dirección</label>
                            <input type="text"
                                   th:field="*{direccion}"
                                   id="direccion"
                                   class="form-control"
                                   th:placeholder="#{admin.clubs.form.placeholder.address}">
                        </div>
                    </div>
                </div>

                <!-- Contacto -->
                <div class="form-section">
                    <h2 class="section-title">
                        <i class="fas fa-phone-alt"></i>
                        <span th:text="#{admin.clubs.form.section.contact}">Contacto</span>
                    </h2>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="telefonoContacto" th:text="#{admin.clubs.form.field.phone}">Teléfono</label>
                            <input type="text"
                                   th:field="*{telefonoContacto}"
                                   id="telefonoContacto"
                                   class="form-control"
                                   th:placeholder="#{admin.clubs.form.placeholder.phone}">
                        </div>

                        <div class="form-group">
                            <label for="emailContacto" th:text="#{admin.clubs.form.field.email}">Email</label>
                            <input type="email"
                                   th:field="*{emailContacto}"
                                   id="emailContacto"
                                   class="form-control"
                                   th:placeholder="#{admin.clubs.form.placeholder.email}">
                        </div>
                    </div>
                </div>

                <!-- Enlaces -->
                <div class="form-section">
                    <h2 class="section-title">
                        <i class="fas fa-link"></i>
                        <span th:text="#{admin.clubs.form.section.links}">Enlaces</span>
                    </h2>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="websiteUrl" th:text="#{admin.clubs.form.field.website}">Sitio Web</label>
                            <input type="url"
                                   th:field="*{websiteUrl}"
                                   id="websiteUrl"
                                   class="form-control"
                                   th:placeholder="#{admin.clubs.form.placeholder.website}">
                        </div>

                        <div class="form-group">
                            <label for="mapaUrl" th:text="#{admin.clubs.form.field.map}">URL del Mapa</label>
                            <input type="url"
                                   th:field="*{mapaUrl}"
                                   id="mapaUrl"
                                   class="form-control"
                                   th:placeholder="#{admin.clubs.form.placeholder.map}">
                        </div>

                        <div class="form-group">
                            <label for="logoUrl" th:text="#{admin.clubs.form.field.logo}">URL del Logo</label>
                            <input type="url"
                                   th:field="*{logoUrl}"
                                   id="logoUrl"
                                   class="form-control"
                                   th:placeholder="#{admin.clubs.form.placeholder.logo}">
                        </div>
                    </div>
                </div>

                <!-- Descripción -->
                <div class="form-section">
                    <h2 class="section-title">
                        <i class="fas fa-align-left"></i>
                        <span th:text="#{admin.clubs.form.section.description}">Descripción</span>
                    </h2>

                    <div class="form-group">
                        <textarea th:field="*{descripcion}"
                                  id="descripcion"
                                  class="form-control"
                                  rows="5"
                                  th:placeholder="#{admin.clubs.form.placeholder.description}"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn"
                            th:data-saving="#{admin.clubs.form.saving}">
                        <i class="fas fa-save"></i>
                        <span th:text="${club.id == null} ? #{admin.clubs.form.btn.create} : #{admin.clubs.form.btn.save}"></span>
                    </button>
                    <a href="/admin/clubs" class="btn btn-outline">
                        <i class="fas fa-times"></i>
                        <span th:text="#{admin.clubs.form.btn.cancel}">Cancelar</span>
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/admin-footer :: footer}"></footer>

<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/admin.js}"></script>

<!-- Script adicional para prevenir envío doble -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('clubForm');
        const submitBtn = document.getElementById('submitBtn');

        if (form) {
            form.addEventListener('submit', function() {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (submitBtn.dataset.saving || 'Guardando...');
            });
        }
    });
</script>
</body>
</html>
