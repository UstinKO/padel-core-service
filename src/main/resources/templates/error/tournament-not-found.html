<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <meta name="robots" content="noindex">
    <title th:text="#{error404tournament.title}">Torneo no encontrado | 1-Padel</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/2.svg}">
    <link rel="alternate icon" th:href="@{/images/favicon.ico}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page-simple">

<header class="header">
    <div class="container">
        <nav class="navbar">
            <a href="/" class="navbar-brand">
                <img th:src="@{/images/1.svg}" alt="1-Padel Logo" class="navbar-logo" width="40" height="40">
                <span class="navbar-brand-text">1-<span class="brand-highlight">PADEL</span></span>
            </a>
        </nav>
    </div>
</header>

<main class="auth-main-simple">
    <div class="container">
        <div class="auth-container">
            <div class="auth-card" style="text-align: center;">

                <div style="margin-bottom: 1.5rem;">
                    <div style="display: inline-flex; align-items: center; justify-content: center;
                                width: 80px; height: 80px; border-radius: 50%;
                                background: rgba(148,163,184,0.15);">
                        <i class="fas fa-trophy" style="font-size: 2.2rem; color: var(--color-text-light);"></i>
                    </div>
                </div>

                <h2 class="auth-card-title" th:text="#{error404tournament.heading}">Torneo no disponible</h2>

                <p style="color: var(--color-text-light); margin: 0.75rem 0 1.75rem; line-height: 1.6;"
                   th:text="#{error404tournament.desc}">
                    Este torneo ya finalizó o ya no está disponible.
                </p>

                <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                    <a th:if="${isAuthenticated}" href="/players/dashboard" class="btn btn-primary">
                        <i class="fas fa-th-large"></i> <span th:text="#{error403.btn.dashboard}">Mi panel</span>
                    </a>
                    <a href="/torneos" class="btn" th:classappend="${isAuthenticated} ? 'btn-outline' : 'btn-primary'">
                        <i class="fas fa-trophy"></i> <span th:text="#{error404tournament.btn.tournaments}">Ver torneos</span>
                    </a>
                </div>

            </div>
        </div>
    </div>
</main>

<footer class="footer" style="padding: 1rem 0;">
    <div class="container">
        <div class="footer-bottom" style="justify-content: center; text-align: center; border-top: none;">
            <div class="footer-copyright" th:text="#{footer.copyright}">
                © 2026 1-Padel. Todos los derechos reservados.
            </div>
        </div>
    </div>
</footer>

</body>
</html>
