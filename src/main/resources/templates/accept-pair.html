<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{accept_pair.title}">Confirmar pareja - 1-Padel</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .accept-pair-container {
            max-width: 480px;
            margin: 48px auto;
            width: min(480px, calc(100% - 32px));
            box-sizing: border-box;
            padding: 40px 32px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,.12);
            text-align: center;
        }
        .accept-pair-icon { font-size: 3rem; margin-bottom: 16px; }
        .accept-pair-title { font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
        .accept-pair-subtitle { color: #64748b; margin-bottom: 28px; font-size: .95rem; }
        .btn-accept {
            display: inline-block;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 14px 36px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
        }
        .btn-cancel:disabled, .btn-accept:disabled { opacity: .6; cursor: not-allowed; }
        .btn-cancel {
            display: inline-block;
            background: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: .9rem;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
        }
        .accept-pair-container a { display: inline-block; margin-top: 14px; }
        #resultMsg {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: .9rem;
        }
        #resultMsg.success { background: #dcfce7; color: #166534; }
        #resultMsg.error   { background: #fee2e2; color: #991b1b; }
    </style>
    <th:block th:replace="~{fragments/analytics :: ga4}"></th:block>
    <th:block th:replace="~{fragments/analytics :: cookie-consent}"></th:block>
    <th:block th:replace="~{fragments/analytics :: clarity}"></th:block>
</head>
<body data-clarity-mask="true">
<div class="accept-pair-container">
    <div class="accept-pair-icon">🎾</div>
    <div class="accept-pair-title" th:text="#{accept_pair.heading}">Confirmar pareja</div>
    <p class="accept-pair-subtitle" th:text="#{accept_pair.subtitle}">
        Al aceptar, quedarán confirmados como pareja en el torneo. Esta acción no se puede deshacer.
    </p>

    <button id="acceptBtn" class="btn-accept" type="button" th:text="#{accept_pair.btn.accept}"></button>
    <button id="declineBtn" class="btn-cancel" type="button" th:text="#{accept_pair.btn.decline}"></button>
    <a href="/" th:text="#{accept_pair.btn.back}">Volver al inicio</a>
    <div id="resultMsg" role="status" aria-live="polite" th:attr="
         data-confirmed=#{accept_pair.success},data-waitlist=#{accept_pair.waitlist},
         data-declined=#{accept_pair.declined},data-resolved=#{accept_pair.resolved},
         data-expired=#{accept_pair.expired},data-error=#{accept_pair.error.default},
         data-connection=#{accept_pair.error.connection}"></div>
    <span id="pairProposalToken" hidden th:data-token="${token}"></span>
</div>

<script th:src="@{/js/registration-tracking.js}"></script>
<script th:src="@{/js/pair-proposal-response.js}" defer></script>
</body>
</html>
