<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción cancelada - 1-Padel</title>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f7fa; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header { background: linear-gradient(135deg, #64748b 0%, #94a3b8 100%); padding: 30px 20px; text-align: center; }
        .header h1 { color: white; margin: 15px 0 0; font-weight: 700; font-size: 24px; }
        .content { padding: 35px 30px; line-height: 1.7; }
        .greeting { font-size: 20px; font-weight: 600; color: #475569; margin-bottom: 16px; }
        .message { font-size: 16px; color: #4a5568; margin-bottom: 20px; }
        .info-box { background: #f8fafc; border-radius: 10px; padding: 16px 20px; margin: 16px 0; }
        .label { font-size: 12px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
        .value { font-size: 15px; color: #1f2937; margin-bottom: 12px; }
        .reason-box { background: #fef2f2; border-left: 4px solid #ef4444; border-radius: 8px; padding: 14px 18px; margin: 20px 0; }
        .footer { background: #f8fafc; padding: 20px 30px; text-align: center; font-size: 13px; color: #9ca3af; }
    </style>
</head>
<body>
<div style="padding: 20px 0;">
<div class="container">
    <div class="header">
        <h1 th:text="#{email.registration_cancelled.header}">Tu inscripción fue cancelada</h1>
    </div>
    <div class="content">
        <div class="greeting" th:text="#{email.common.greeting(${playerName})}">¡Hola, Juan!</div>
        <div class="message" th:text="#{email.registration_cancelled.text}">Tu participación en el siguiente torneo fue cancelada:</div>

        <div class="info-box">
            <div class="label" th:text="#{email.registration_cancelled.label.tournament}">Torneo</div>
            <div class="value" th:text="${tournamentName}">Torneo de Pádel</div>
            <div class="label" th:text="#{email.registration_cancelled.label.date}">Fecha</div>
            <div class="value" th:text="${tournamentDate} + ' ' + ${tournamentTime}">15 de julio de 2025, 10:00</div>
            <div class="label" th:text="#{email.registration_cancelled.label.club}">Club</div>
            <div class="value" th:text="${clubName}">Club Padel Central</div>
        </div>

        <div class="reason-box" th:if="${cancellationReason != null and !cancellationReason.isBlank()}">
            <span class="label" th:text="#{email.registration_cancelled.reason_label}">Motivo</span>
            <p class="value" style="margin: 4px 0 0;" th:text="${cancellationReason}">Motivo de la cancelación</p>
        </div>

        <p class="message" th:text="#{email.registration_cancelled.contact_note}">Si crees que esto ocurrió por error, por favor contactá al organizador.</p>
    </div>
    <div class="footer">
        1-Padel &copy; <span th:text="${year}">2025</span>
    </div>
</div>
</div>
</body>
</html>
