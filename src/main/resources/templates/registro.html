<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="app-profile" th:content="${@environment.getActiveProfiles().length > 0
        ? @environment.getActiveProfiles()[0]
        : 'default'}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="1-Padel - Regístrate gratis en la plataforma de torneos de pádel. Crea tu cuenta y empieza a jugar.">
    <meta name="keywords" content="pádel, registro, crear cuenta, torneos, 1-padel">
    <meta name="author" content="1-Padel">
    <meta name="theme-color" content="#FF6B35">

    <meta property="og:title" content="1-Padel - Regístrate gratis">
    <meta property="og:description" content="Crea tu cuenta en 1-Padel y participa en los mejores torneos de pádel">
    <meta property="og:image" content="/images/og-image.jpg">
    <meta property="og:url" content="https://1-padel.com/players/registro">
    <meta name="twitter:card" content="summary_large_image">

    <title th:text="#{registro.title}">Registro | 1-Padel</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/2.svg}">
    <link rel="alternate icon" th:href="@{/images/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth-entry.css}">

    <th:block th:replace="~{fragments/analytics :: ga4}"></th:block>
    <th:block th:replace="~{fragments/analytics :: cookie-consent}"></th:block>
    <th:block th:replace="~{fragments/analytics :: clarity}"></th:block>
</head>
<body class="auth-page-simple auth-entry auth-entry-register" data-clarity-mask="true">
<!-- Header con nuevo logo y botón de login -->
<header th:replace="~{fragments/auth-entry :: header('/players/registro', null)}"></header>

<main class="auth-main-simple">
    <div class="container">
        <div class="auth-container">
            <!-- Registration Form -->
            <div class="auth-card">
                <div class="auth-card-header">
                    <h1 class="auth-card-title" th:text="#{registro.heading}">Crear cuenta</h1>
                </div>
                <div th:replace="~{fragments/auth-entry :: google(null)}"></div>
                <p class="auth-entry-divider" th:text="#{registro.or_email}">o crea una cuenta con email</p>

                <!-- Registration Form -->
                <form th:action="@{/players/registro}" method="post" class="auth-form" id="registroForm" th:object="${registroRequest}" th:attr="data-password-mismatch=#{registro.web.password.mismatch},
                    data-password-rules=#{registro.field.password.hint},
                    data-captcha-required=#{registro.web.captcha},
                    data-submitting=#{auth.entry.submitting}">
                    <!-- Ограничение частоты запросов -->
                    <div th:if="${param.error != null and param.error[0] == 'rate-limit'}"
                         style="background:#fff7ed; border-left:4px solid #f59e0b; border-radius:8px;
                                color:#92400e; padding:1rem 1.25rem; display:flex;
                                gap:.75rem; align-items:flex-start; margin-bottom:.5rem;">
                        <i class="fas fa-clock" style="color:#f59e0b; font-size:1.25rem; flex-shrink:0; margin-top:.1rem;"></i>
                        <div>
                            <strong style="display:block; margin-bottom:.25rem;" th:text="#{registro.alert.rate_limit.title}">Demasiadas solicitudes</strong>
                            <span th:utext="#{registro.alert.rate_limit.msg}">Has superado el límite de intentos. Por favor, espera <strong>1 minuto</strong> antes de intentarlo de nuevo.</span>
                        </div>
                    </div>

                    <div id="registrationError" class="alert alert-error" role="alert" tabindex="-1"
                         th:style="${errorMessage == null} ? 'display:none' : ''">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="registrationErrorText" th:text="${errorMessage}"></span>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        <span th:text="${successMessage}">Éxito</span>
                    </div>

                    <div class="auth-entry-pair">
                        <div class="form-group">
                            <div class="auth-entry-inset">
                                <input type="text" id="nombre" name="nombre"
                                       class="form-control"
                                       placeholder=" "
                                       required th:field="*{nombre}" aria-describedby="nombreError" th:attr="aria-invalid=${#fields.hasErrors('nombre')}" minlength="3" maxlength="100" autocomplete="given-name">
                                <label for="nombre"><span th:text="#{registro.field.nombre}"></span></label>
                            </div>
                            <small class="registration-field-error" id="nombreError"
                                   th:text="${#fields.hasErrors('nombre') ? #fields.errors('nombre')[0] : ''}" aria-live="polite"></small>
                        </div>
                        <div class="form-group">
                            <div class="auth-entry-inset">
                                <input type="text" id="apellido" name="apellido"
                                       class="form-control"
                                       placeholder=" "
                                       required th:field="*{apellido}" aria-describedby="apellidoError" th:attr="aria-invalid=${#fields.hasErrors('apellido')}" minlength="3" maxlength="100" autocomplete="family-name">
                                <label for="apellido"><span th:text="#{registro.field.apellido}"></span></label>
                            </div>
                            <small class="registration-field-error" id="apellidoError"
                                   th:text="${#fields.hasErrors('apellido') ? #fields.errors('apellido')[0] : ''}" aria-live="polite"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="auth-entry-inset">
                            <input type="email" id="email" name="email"
                                   class="form-control"
                                   placeholder=" "
                                   required th:field="*{email}" aria-describedby="emailError" th:attr="aria-invalid=${#fields.hasErrors('email')}" maxlength="150" autocomplete="email">
                            <label for="email"><span th:text="#{registro.field.email}"></span></label>
                        </div>
                        <small class="registration-field-error" id="emailError"
                               th:text="${#fields.hasErrors('email') ? #fields.errors('email')[0] : ''}" aria-live="polite"></small>
                    </div>
                    <div class="form-group">
                        <div class="auth-entry-inset">
                            <input type="tel" id="telefono" name="telefono"
                                   class="form-control"
                                   placeholder=" " th:field="*{telefono}" aria-describedby="telefonoError" th:attr="aria-invalid=${#fields.hasErrors('telefono')}" required maxlength="20" autocomplete="tel">
                            <label for="telefono"><span th:text="#{registro.field.telefono}"></span><small th:text="#{auth.entry.required}"></small></label>
                        </div>
                        <small class="registration-field-error" id="telefonoError"
                               th:text="${#fields.hasErrors('telefono') ? #fields.errors('telefono')[#fields.errors('telefono').size() - 1] : ''}" aria-live="polite"></small>
                    </div>
                    <div class="form-group">
                        <div class="auth-entry-inset">
                            <input type="text" id="telegramUsername" name="telegramUsername"
                                   class="form-control"
                                   placeholder=" " th:field="*{telegramUsername}" aria-describedby="telegramUsernameError" th:attr="aria-invalid=${#fields.hasErrors('telegramUsername')}" maxlength="33" autocomplete="off">
                            <label for="telegramUsername"><span th:text="#{registro.field.telegram}"></span><small th:text="#{auth.entry.optional}"></small></label>
                        </div>
                        <small class="registration-field-error" id="telegramUsernameError"
                               th:text="${#fields.hasErrors('telegramUsername') ? #fields.errors('telegramUsername')[0] : ''}" aria-live="polite"></small>
                    </div>
                    <div class="form-group">
                        <div class="auth-entry-inset">
                            <select id="nivelJugador" name="nivelJugador" class="form-control" required th:field="*{nivelJugador}" aria-describedby="nivelJugadorError" th:attr="aria-invalid=${#fields.hasErrors('nivelJugador')}">
                                <option value=""></option>
                                <option value="C9">C9</option>
                                <option value="C8">C8</option>
                                <option value="C7">C7</option>
                                <option value="C6">C6</option>
                                <option value="C5">C5</option>
                                <option value="D9">D9</option>
                                <option value="D7">D7</option>
                                <option value="D8">D8</option>
                                <option value="D6">D6</option>
                                <option value="C4">C4</option>
                            </select>
                            <label for="nivelJugador"><span th:text="#{registro.field.nivel}"></span></label>
                        </div>
                        <small class="registration-field-error" id="nivelJugadorError"
                               th:text="${#fields.hasErrors('nivelJugador') ? #fields.errors('nivelJugador')[0] : ''}" aria-live="polite"></small>
                    </div>
                    <div class="auth-entry-pair auth-entry-passwords">
                        <div class="form-group">
                            <div class="auth-entry-inset auth-entry-password">
                                <input type="password" id="password" name="password"
                                       class="form-control"
                                       placeholder=" "
                                       required
                                       minlength="8" aria-describedby="passwordError passwordRules" th:attr="aria-invalid=${#fields.hasErrors('password')}" autocomplete="new-password" maxlength="100">
                                <label for="password"><span th:text="#{registro.field.password}"></span></label>
                                <button type="button" class="toggle-password" data-target="password"
                                        th:attr="aria-label=#{registro.field.password.toggle}" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <small class="registration-field-error" id="passwordError"
                                   th:text="${#fields.hasErrors('password') ? #fields.errors('password')[0] : ''}" aria-live="polite"></small>
                        </div>
                        <div class="form-group">
                            <div class="auth-entry-inset auth-entry-password">
                                <input type="password" id="confirmPassword" name="confirmPassword"
                                       class="form-control"
                                       placeholder=" "
                                       required aria-describedby="confirmPasswordError" th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')}" autocomplete="new-password" maxlength="100">
                                <label for="confirmPassword"><span th:text="#{auth.entry.confirm}"></span></label>
                                <button type="button" class="toggle-password" data-target="confirmPassword"
                                        th:attr="aria-label=#{registro.field.password.toggle}" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <small class="registration-field-error" id="confirmPasswordError"
                                   th:text="${#fields.hasErrors('confirmPassword') ? #fields.errors('confirmPassword')[0] : ''}" aria-live="polite"></small>
                        </div>
                    </div>
                    <p class="auth-entry-password-rules" id="passwordRules" th:text="#{registro.field.password.hint}"></p>

                    <!-- Условия использования -->
                    <div class="form-checkbox">
                        <input type="checkbox" id="terminos" name="terminos" required aria-describedby="terminosError" th:checked="${param.terminos != null}">
                        <label for="terminos" th:utext="#{registro.terms}">
                            Acepto los <a href="/terminos" target="_blank">Términos y Condiciones</a> y la
                            <a href="/privacidad" target="_blank">Política de Privacidad</a>
                        </label>
                    </div>

                    <small id="terminosError" class="registration-field-error" aria-live="polite"></small>

                    <!-- reCAPTCHA v2 -->
                    <div th:if="${recaptchaEnabled}" class="auth-entry-captcha">
                        <div class="g-recaptcha" th:attr="data-sitekey=${recaptchaSiteKey}"></div>
                        <small id="captchaError" class="registration-field-error" aria-live="polite"></small>
                    </div>

                    <!-- Honeypot: боты заполнят, люди — нет -->
                    <div style="position: absolute; left: -9999px; opacity: 0;" aria-hidden="true">
                        <input type="text" name="website" id="website" tabindex="-1" autocomplete="off">
                        <label for="website">Website</label>
                    </div>

                    <!-- Создание аккаунта -->
                    <button type="submit" class="btn btn-primary btn-block btn-large" id="submitBtn">
                        <i class="fas fa-user-plus"></i>
                        <span th:text="#{registro.btn.submit}">Registrarse</span>
                    </button>
                </form>

                <p class="auth-entry-switch">
                    <span th:text="#{registro.has_account}">¿Ya tienes cuenta?</span>
                    <a th:href="@{/login}" class="auth-link" th:text="#{registro.login_link}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</main>

<!-- Footer simple con nuevo branding -->
<footer class="footer" style="padding: 1rem 0; background: transparent; color: var(--color-text-light);">
    <div class="container">
        <div class="footer-bottom" style="justify-content: center; text-align: center; border-top: none;">
            <div class="footer-copyright" th:text="#{footer.copyright}">
                © 2026 1-Padel. Todos los derechos reservados.
            </div>
        </div>
    </div>
</footer>
<script th:src="@{/js/logger.js}"></script>
<script th:src="${'/js/i18n/messages-' + #locale.language + '.js'}"></script>
<script th:src="@{/js/i18n/t.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/web-signup.js}"></script>
<script th:if="${recaptchaEnabled}" th:src="@{https://www.google.com/recaptcha/api.js(hl=${#locale.language})}" async defer></script>


</body>
</html>
