<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="app-profile" th:content="${@environment.getActiveProfiles().length > 0
        ? @environment.getActiveProfiles()[0]
        : 'default'}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <meta name="description" content="1-Padel - Regístrate gratis en la plataforma de torneos de pádel. Crea tu cuenta y empieza a jugar.">
    <meta name="keywords" content="pádel, registro, crear cuenta, torneos, 1-padel">
    <meta name="author" content="1-Padel">
    <meta name="theme-color" content="#FF6B35">

    <meta property="og:title" content="1-Padel - Regístrate gratis">
    <meta property="og:description" content="Crea tu cuenta en 1-Padel y participa en los mejores torneos de pádel">
    <meta property="og:image" content="/images/og-image.jpg">
    <meta property="og:url" content="https://1-padel.com/players/registro">
    <meta name="twitter:card" content="summary_large_image">

    <title>Registro | 1-Padel</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/2.svg}">
    <link rel="alternate icon" th:href="@{/images/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/registro.css}">

    <script th:if="${recaptchaEnabled}" src="https://www.google.com/recaptcha/api.js?hl=es" async defer></script>
</head>
<body class="auth-page-simple">
<!-- Header con nuevo logo y botón de login -->
<header class="header">
    <div class="container">
        <nav class="navbar">
            <a href="/" class="navbar-brand">
                <!-- Nuevo logo desde 2.svg -->
                <img th:src="@{/images/1.svg}" alt="1-Padel Logo" class="navbar-logo" width="40" height="40">
                <span class="navbar-brand-text">1-<span class="brand-highlight">PADEL</span></span>
            </a>

            <!-- Botón de login rápido -->
            <div class="navbar-auth">
                <a href="/login" class="btn btn-outline-sm">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar sesión
                </a>
            </div>
        </nav>
    </div>
</header>

<main class="auth-main-simple">
    <div class="container">
        <div class="auth-container">
            <!-- Registration Form -->
            <div class="auth-card">
                <div class="auth-card-header">
                    <h2 class="auth-card-title">Crear cuenta</h2>
                    <p class="auth-card-subtitle">
                        ¿Ya tienes cuenta?
                        <a href="/login" class="auth-link">Inicia sesión</a>
                    </p>
                </div>

                <!-- ===== BLOQUE SOCIAL ÚNICO (AHORA CENTRADO) ===== -->
                <div style="display: flex; justify-content: center; width: 100%;">
                    <div class="auth-social" style="justify-content: center; width: auto; min-width: 200px;">
                        <a href="/oauth2/authorization/google" class="btn" style="margin: 0;">
                            <i class="fab fa-google"></i> Google
                        </a>
                    </div>
                </div>

                <!-- Pequeño texto opcional debajo (puedes quitarlo si no quieres) -->
                <p style="text-align: center; margin-top: 1rem; color: #6b7280; font-size: 0.85rem;">
                    <i class="fas fa-shield-alt" style="margin-right: 0.25rem;"></i>
                    Tus datos están seguros con Google
                </p>

                <!-- Separador -->
                <div class="form-divider" style="margin-bottom: 2rem;">
                    <span>o crea una cuenta con email</span>
                </div>

                <!-- Registration Form -->
                <form action="/players/registro" method="post" class="auth-form" id="registroForm">
                    <!-- Error Messages -->
                    <div th:if="${errorMessage}" class="alert alert-error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span th:text="${errorMessage}">Error</span>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        <span th:text="${successMessage}">Éxito</span>
                    </div>

                    <!-- Nombre -->
                    <div class="form-group">
                        <label for="nombre" class="form-label">
                            <i class="fas fa-user"></i> Nombre
                        </label>
                        <div class="input-with-icon">
                            <input type="text" id="nombre" name="nombre"
                                   class="form-control"
                                   placeholder="Tu nombre"
                                   required
                                   th:value="${param.nombre}">
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>

                    <!-- Apellido -->
                    <div class="form-group">
                        <label for="apellido" class="form-label">
                            <i class="fas fa-user"></i> Apellido
                        </label>
                        <div class="input-with-icon">
                            <input type="text" id="apellido" name="apellido"
                                   class="form-control"
                                   placeholder="Tu apellido"
                                   required
                                   th:value="${param.apellido}">
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <div class="input-with-icon">
                            <input type="email" id="email" name="email"
                                   class="form-control"
                                   placeholder="tu@email.com"
                                   required
                                   th:value="${param.email}">
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                    </div>

                    <!-- Teléfono -->
                    <div class="form-group">
                        <label for="telefono" class="form-label">
                            <i class="fas fa-phone"></i> Teléfono
                            <span style="color: #999; font-weight: 400;">(opcional)</span>
                        </label>
                        <div class="input-with-icon">
                            <input type="tel" id="telefono" name="telefono"
                                   class="form-control"
                                   placeholder="+34 600 000 000"
                                   th:value="${param.telefono}">
                            <i class="fas fa-phone input-icon"></i>
                        </div>
                    </div>

                    <!-- Nivel de juego -->
                    <div class="form-group">
                        <label for="nivelJugador" class="form-label">
                            <i class="fas fa-chart-line"></i> Nivel de juego
                            <span style="color: #999; font-weight: 400;">(opcional)</span>
                        </label>
                        <div class="input-with-icon">
                            <select id="nivelJugador" name="nivelJugador" class="form-control">
                                <option value="">Selecciona tu nivel</option>
                                <option value="C9">C9</option>
                                <option value="C8">C8</option>
                                <option value="C7">C7</option>
                                <option value="C6">C6</option>
                                <option value="C5">C5</option>
                                <option value="D7">D7</option>
                                <option value="D8">D8</option>
                                <option value="D6">D6</option>
                                <option value="C4">C4</option>
                            </select>
                            <i class="fas fa-chart-line input-icon"></i>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i> Contraseña
                        </label>
                        <div class="input-with-icon">
                            <input type="password" id="password" name="password"
                                   class="form-control"
                                   placeholder="Mínimo 8 caracteres"
                                   required
                                   minlength="8">
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar/ocultar contraseña">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar"></div>
                        </div>
                        <small class="form-text">
                            Mínimo 8 caracteres, 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial
                        </small>
                    </div>

                    <!-- Confirmar Contraseña -->
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">
                            <i class="fas fa-lock"></i> Confirmar contraseña
                        </label>
                        <div class="input-with-icon">
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   class="form-control"
                                   placeholder="Repite la contraseña"
                                   required>
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar/ocultar contraseña">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Términos y condiciones -->
                    <div class="form-checkbox">
                        <input type="checkbox" id="terminos" name="terminos" required>
                        <label for="terminos">
                            Acepto los <a href="/terminos" target="_blank">Términos y Condiciones</a> y la
                            <a href="/privacidad" target="_blank">Política de Privacidad</a>
                        </label>
                    </div>

                    <!-- reCAPTCHA v2 -->
                    <div th:if="${recaptchaEnabled}" class="g-recaptcha" th:attr="data-sitekey=${recaptchaSiteKey}" style="margin-bottom: 1rem;"></div>

                    <!-- Honeypot: боты заполнят, люди — нет -->
                    <div style="position: absolute; left: -9999px; opacity: 0;" aria-hidden="true">
                        <input type="text" name="website" id="website" tabindex="-1" autocomplete="off">
                        <label for="website">Website</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-block btn-large" id="submitBtn">
                        <i class="fas fa-user-plus"></i>
                        Registrarse
                    </button>
                </form>

                <!-- Separador -->
                <div class="form-divider" style="margin: 1.5rem 0 0.75rem;">
                    <span>o regístrate con</span>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer simple con nuevo branding -->
<footer class="footer" style="padding: 1rem 0; background: transparent; color: var(--color-text-light);">
    <div class="container">
        <div class="footer-bottom" style="justify-content: center; text-align: center; border-top: none;">
            <div class="footer-copyright">
                <i class="far fa-copyright"></i> 2026 1-Padel. Todos los derechos reservados.
            </div>
        </div>
    </div>
</footer>
<script th:src="@{/js/logger.js}"></script>
<script th:src="@{/js/auth.js}"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('registroForm');
        const submitBtn = document.getElementById('submitBtn');

        if (!form) {
            console.error('Form not found!');
            return;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Валидация терминов
            if (!document.getElementById('terminos').checked) {
                showNotification('Debes aceptar los términos y condiciones', 'warning');
                return;
            }

            // Валидация паролей
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                showNotification('Las contraseñas no coinciden', 'error');
                return;
            }

            // Валидация сложности пароля
            const passwordRegex = /^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!]).{8,}$/;
            if (!passwordRegex.test(password)) {
                showNotification('La contraseña debe contener al menos: 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial', 'warning');
                return;
            }

            // Проверяем reCAPTCHA v2 (только если включена)
            const recaptchaEnabled = /*[[${recaptchaEnabled}]]*/ false;
            if (recaptchaEnabled && typeof grecaptcha !== 'undefined' && !grecaptcha.getResponse()) {
                showNotification('Por favor completa la verificación de seguridad', 'warning');
                return;
            }

            // Блокируем кнопку и отправляем
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registrando...';
            form.submit();
        });
    });
    /*]]>*/
</script>
</body>
</html>
