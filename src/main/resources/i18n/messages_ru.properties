home.faq.4.q=За сколько времени нужно прийти?
home.faq.4.a1=Рекомендуем приходить <strong>за 15 минут</strong> до начала турнира.
home.faq.5.q=Сколько длится турнир?
home.faq.5.a1=<strong>Парные турниры:</strong> 3,5 – 4 часа
home.faq.5.a2=<strong>Одиночные турниры:</strong> 3 часа (фиксированное время)
home.faq.6.q=Сколько матчей я сыграю?
home.faq.6.a1=<strong>Парные турниры:</strong> минимум 3 гарантированных матча
home.faq.6.a2=<strong>Одиночные турниры:</strong> от 12 до 18 матчей в зависимости от формата
home.faq.7.q=Какой формат у турниров?
home.faq.7.a1=Мы работаем преимущественно с:
home.faq.7.a2=<strong>Американо Пары</strong> — фиксированная пара на весь турнир
home.faq.7.a3=<strong>Американо</strong> — партнёр меняется в каждом матче
home.faq.7.a4=<strong>Король корта</strong> — переходите между кортами по результатам
home.faq.8.q=Что будет, если я проиграю первый матч?
home.faq.8.a1=Вы продолжаете играть. Все игроки гарантированно участвуют в матчах.
home.faq.9.q=Всё проходит в один день?
home.faq.9.a1=Да. Все турниры начинаются и заканчиваются в один день.
home.faq.10.q=Отменяется ли турнир из-за дождя?
home.faq.10.a1=Нет. Корты крытые, турниры проходят в любую погоду.
home.faq.11.q=Сколько максимум игроков?
home.faq.11.a1=<strong>Парные турниры:</strong> до 16 пар
home.faq.11.a2=<strong>Одиночные турниры:</strong> около 20 игроков
home.faq.12.q=Что будет, если я опоздаю?
home.faq.12.a1=<strong>До 15 минут опоздания</strong> → можно начать со счёта 0:3
home.faq.12.a2=<strong>Позже</strong> → матч может быть засчитан 0:6
home.faq.13.q=Можно ли поменять партнёра?
home.faq.13.a1=Да, но нужно сообщить <strong>до начала</strong> турнира.
home.faq.14.q=Что делать, если не смогу прийти?
home.faq.14.a1=Необходимо отменить регистрацию заранее. Условия зависят от турнира.
home.faq.15.q=Как связаться с организатором?
home.faq.15.a1=Напишите нам в <strong>WhatsApp</strong>.

