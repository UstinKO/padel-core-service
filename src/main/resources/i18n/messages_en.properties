# ─── Home ─────────────────────────────────────────────────────────────────────
home.title=1-Padel - Padel tournaments
home.hero.title=All padel tournaments in one place
home.section.upcoming=Upcoming Tournaments
home.faq.title=FAQ
home.faq.1.q=How do I register for a tournament?
home.faq.1.a1=Choose the tournament in the Tournaments section and press <strong>Register</strong>.
home.faq.1.a2=You will receive confirmation after registration.
home.faq.2.q=Can I register alone?
home.faq.2.a1=Yes. In singles tournaments you can register alone.
home.faq.2.a2=In doubles tournaments, if you don't have a partner, we can help you find one.
home.faq.3.q=What level do I need to play?
home.faq.3.a1=Tournaments are divided by levels (C9, C8, C7, etc.).
home.faq.3.a2=If you don't know your level, write to us and we'll help you choose.
home.faq.4.q=How early should I arrive?
home.faq.4.a1=We recommend arriving <strong>15 minutes</strong> before the tournament starts.
home.faq.5.q=How long does the tournament last?
home.faq.5.a1=<strong>Doubles tournaments:</strong> 3.5 – 4 hours
home.faq.5.a2=<strong>Singles tournaments:</strong> 3 hours (fixed time)
home.faq.6.q=How many matches will I play?
home.faq.6.a1=<strong>Doubles tournaments:</strong> minimum 3 guaranteed matches
home.faq.6.a2=<strong>Singles tournaments:</strong> between 12 and 18 matches, depending on format
home.faq.7.q=What is the tournament format?
home.faq.7.a1=We mainly work with:
home.faq.7.a2=<strong>Americano Pairs</strong> — fixed pair throughout the tournament
home.faq.7.a3=<strong>Americano</strong> — partner changes in each match
home.faq.7.a4=<strong>King of Court</strong> — move up or down courts based on results
home.faq.8.q=What happens if I lose the first match?
home.faq.8.a1=You keep playing. All players have guaranteed matches.
home.faq.9.q=Is it played on the same day?
home.faq.9.a1=Yes. All tournaments start and finish on the same day.
home.faq.10.q=Is the tournament cancelled due to rain?
home.faq.10.a1=No. The courts are covered, so tournaments are played normally.
home.faq.11.q=What is the maximum number of players?
home.faq.11.a1=<strong>Doubles tournaments:</strong> up to 16 pairs
home.faq.11.a2=<strong>Singles tournaments:</strong> approx. 20 players
home.faq.12.q=What happens if I arrive late?
home.faq.12.a1=<strong>Up to 15 minutes late</strong> → you may start 0 – 3
home.faq.12.a2=<strong>Later</strong> → you may lose the match 0 – 6
home.faq.13.q=Can I change my partner?
home.faq.13.a1=Yes, but you must notify us <strong>before the start</strong> of the tournament.
home.faq.14.q=What if I can't attend?
home.faq.14.a1=You must cancel in advance. Conditions depend on the tournament.
home.faq.15.q=How can I contact the organiser?
home.faq.15.a1=You can write to us via <strong>WhatsApp</strong>.

