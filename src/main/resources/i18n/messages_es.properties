# ─── index.html (home) ────────────────────────────────────────────────────────
home.title=1-Padel - Torneos de pádel
home.hero.title=Todos los torneos de pádel en un solo lugar
home.section.upcoming=Próximos Torneos
home.faq.title=FAQ
home.faq.1.q=¿Cómo puedo inscribirme en un torneo?
home.faq.1.a1=Elige el torneo en la sección Torneos y presiona <strong>Inscribirme</strong>.
home.faq.1.a2=Recibirás la confirmación después del registro.
home.faq.2.q=¿Puedo inscribirme solo?
home.faq.2.a1=Sí. En torneos individuales puedes inscribirte solo.
home.faq.2.a2=En torneos en pareja, si no tienes compañero, podemos ayudarte a encontrar uno.
home.faq.3.q=¿Qué nivel debo tener para jugar?
home.faq.3.a1=Los torneos están divididos por niveles (C9, C8, C7, etc.).
home.faq.3.a2=Si no sabes tu nivel, escríbenos y te ayudamos a elegir el adecuado.
home.faq.4.q=¿Con cuánto tiempo de anticipación debo llegar?
home.faq.4.a1=Te recomendamos llegar <strong>15 minutos</strong> antes del inicio del torneo.
home.faq.5.q=¿Cuánto dura el torneo?
home.faq.5.a1=<strong>Torneos en parejas:</strong> 3,5 – 4 horas
home.faq.5.a2=<strong>Torneos individuales:</strong> 3 horas (tiempo fijo)
home.faq.6.q=¿Cuántos partidos voy a jugar?
home.faq.6.a1=<strong>Torneos en parejas:</strong> mínimo 3 partidos garantizados
home.faq.6.a2=<strong>Torneos individuales:</strong> entre 12 y 18 partidos, según formato
home.faq.7.q=¿Cómo es la modalidad del torneo?
home.faq.7.a1=Trabajamos principalmente con:
home.faq.7.a2=<strong>Americano Parejas</strong> — pareja fija durante todo el torneo
home.faq.7.a3=<strong>Americano</strong> — cambias de compañero en cada partido
home.faq.7.a4=<strong>Rey de la cancha</strong> — subes o bajas de cancha según resultados
home.faq.8.q=¿Qué pasa si pierdo el primer partido?
home.faq.8.a1=Sigues jugando. Todos los jugadores tienen partidos garantizados.
home.faq.9.q=¿Se juega el mismo día?
home.faq.9.a1=Sí. Todos los torneos empiezan y terminan el mismo día.
home.faq.10.q=¿Se suspende el torneo por lluvia?
home.faq.10.a1=No. Las canchas son techadas, por lo que los torneos se juegan normalmente.
home.faq.11.q=¿Cuál es la cantidad máxima de jugadores?
home.faq.11.a1=<strong>Torneos en parejas:</strong> hasta 16 parejas
home.faq.11.a2=<strong>Torneos individuales:</strong> aprox. 20 jugadores
home.faq.12.q=¿Qué pasa si llego tarde?
home.faq.12.a1=<strong>Hasta 15 minutos tarde</strong> → puedes empezar con 0 – 3
home.faq.12.a2=<strong>Más tarde</strong> → puedes perder el partido 0 – 6
home.faq.13.q=¿Puedo cambiar de compañero?
home.faq.13.a1=Sí, pero debes avisar <strong>antes del inicio</strong> del torneo.
home.faq.14.q=¿Qué hago si no puedo asistir?
home.faq.14.a1=Debes cancelar con anticipación. Las condiciones dependen del torneo.
home.faq.15.q=¿Cómo puedo contactar con el organizador?
home.faq.15.a1=Puedes escribirnos por <strong>WhatsApp</strong>.

