spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
      minimum-idle: ${DB_MIN_IDLE}
      connection-timeout: 30000
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME:60000}
      leak-detection-threshold: ${DB_LEAK_DETECTION:60000}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# Конфигурация защиты от ботов и disposable email
disposable-email-domains:
  enabled: true  # Включение защиты
  checkers:
    reload:
      enabled: true  # Автоматическое обновление черного списка
      fixed-date: PT12H  # Обновление каждые 12 часов
    daily-updated-domains: true  # Скачивание свежего списка с GitHub
    static-domains:
      - telus.com
      - telusinternational.com
      - telus.net
      - test.com
      - example.com
      - domain.com
    # Опционально: локальный файл со списком (если нужно добавить свои домены)
    # local-file: /app/config/blocked-domains.txt

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  base-url: ${APP_BASE_URL}
  email:
    from: ${EMAIL_FROM}
    sender-name: ${EMAIL_SENDER_NAME}
  security:
    registration:
      max-attempts-per-hour: 5  # Лимит попыток регистрации с одного IP
      block-duration-minutes: 60  # Блокировка IP на час при превышении
      require-email-verification: true  # Требовать подтверждение email
      # Honeypot поле (скрытое поле в форме, которое не должны заполнять люди)
      honeypot-enabled: true
      honeypot-field-name: website_url  # Название скрытого поля

logging:
  file:
    name: ${LOG_FILE:/app/logs/application.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:30}
  loki:
    enabled: ${LOKI_ENABLED:false}
    url: ${LOKI_URL:http://loki:3100/loki/api/v1/push}
    batchMaxItems: 1000
    batchTimeoutMs: 5000
  level:
    # Логирование подозрительных регистраций для мониторинга
    com.padle.core.padelcoreservice.validation: WARN
    com.padle.core.padelcoreservice.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:production}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

recaptcha:
  site-key: ${SITE_KEY_V2}
  secret-key: ${SECRET_KEY_V2}
  enabled: true