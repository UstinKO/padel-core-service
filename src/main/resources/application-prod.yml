spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
      minimum-idle: ${DB_MIN_IDLE}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  base-url: ${APP_BASE_URL}
  email:
    from: ${EMAIL_FROM}
    sender-name: ${EMAIL_SENDER_NAME}

logging:
  file:
    name: ${LOG_FILE:/app/logs/application.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:30}
  loki:
    enabled: ${LOKI_ENABLED:false}
    url: ${LOKI_URL:http://loki:3100/loki/api/v1/push}
    batchMaxItems: 1000
    batchTimeoutMs: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:production}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true