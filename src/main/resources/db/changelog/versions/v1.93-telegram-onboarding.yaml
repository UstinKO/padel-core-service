databaseChangeLog:
  - changeSet:
      id: v1.93-telegram-onboarding
      author: codex
      changes:
        - sql:
            sql: |
              CREATE TABLE player_telegram_onboarding (
                id UUID PRIMARY KEY,
                user_id BIGINT NOT NULL UNIQUE CHECK (user_id > 0),
                chat_id BIGINT NOT NULL CHECK (chat_id = user_id),
                token_hash VARCHAR(64) NOT NULL UNIQUE,
                expires_at TIMESTAMPTZ NOT NULL,
                player_id BIGINT REFERENCES player_padel_db(id) ON DELETE CASCADE,
                locale VARCHAR(2) NOT NULL,
                completed BOOLEAN NOT NULL DEFAULT false
              );
              CREATE INDEX idx_player_telegram_onboarding_expiry ON player_telegram_onboarding(expires_at);
