databaseChangeLog:
  - changeSet:
      id: v1.60-qr-club-sources
      author: padel-core
      changes:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE marketing_qr_daily_db DROP CONSTRAINT marketing_qr_daily_db_origen_check;
              ALTER TABLE marketing_qr_daily_db ADD CONSTRAINT marketing_qr_daily_db_origen_check
                CHECK (origen IN ('reby', 'black_padel', '15cero_villa_crespo', '15cero_saavedra'));
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE marketing_qr_daily_db DROP CONSTRAINT marketing_qr_daily_db_origen_check;
              ALTER TABLE marketing_qr_daily_db ADD CONSTRAINT marketing_qr_daily_db_origen_check
                CHECK (origen = 'reby') NOT VALID;
