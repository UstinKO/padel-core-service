databaseChangeLog:
  - changeSet:
      id: v1.43-add-nivel-d9
      author: padel-core
      changes:
        - sql:
            sql: |
              -- Добавляем значение D9 в check constraint (enum Nivel, LFPT-0280/0287)
              ALTER TABLE tournaments_db
                DROP CONSTRAINT IF EXISTS tournaments_db_categoria_nivel_check;

              ALTER TABLE tournaments_db
                ADD CONSTRAINT tournaments_db_categoria_nivel_check
                CHECK (categoria_nivel IN (
                  'C9', 'C8', 'C7', 'C6', 'C5', 'PRINCIPIANTES',
                  'SUMA_15', 'SUMA_13',
                  'D9', 'D7', 'D8', 'D7_D8', 'D6', 'C7_C6',
                  'C4', 'SUMA_14',
                  'TODOS'
                ));
      rollback:
        - sql:
            sql: |
              ALTER TABLE tournaments_db
                DROP CONSTRAINT IF EXISTS tournaments_db_categoria_nivel_check;

              ALTER TABLE tournaments_db
                ADD CONSTRAINT tournaments_db_categoria_nivel_check
                CHECK (categoria_nivel IN (
                  'C9', 'C8', 'C7', 'C6', 'C5', 'PRINCIPIANTES',
                  'SUMA_15', 'SUMA_13',
                  'D7', 'D8', 'D7_D8', 'D6', 'C7_C6',
                  'C4', 'SUMA_14',
                  'TODOS'
                ));
