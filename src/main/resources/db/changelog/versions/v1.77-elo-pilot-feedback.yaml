databaseChangeLog:
  - changeSet:
      id: v1.77-elo-pilot-feedback
      author: padel
      changes:
        - sql:
            sql: |
              CREATE TABLE elo_pilot_feedback_db (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                player_id bigint NOT NULL,
                author_name text NOT NULL,
                request_key uuid NOT NULL,
                source varchar(16) NOT NULL CHECK (source IN ('DASHBOARD', 'RANKING')),
                topic varchar(16) NOT NULL CHECK (topic IN ('QUESTION', 'IDEA', 'ERROR', 'OTHER')),
                message varchar(2000) NOT NULL,
                created_at timestamptz NOT NULL DEFAULT CURRENT_TIMESTAMP,
                mail_status varchar(16) NOT NULL DEFAULT 'PENDING' CHECK (mail_status IN ('PENDING', 'SENT', 'FAILED')),
                UNIQUE (player_id, request_key)
              );
      rollback:
        - dropTable:
            tableName: elo_pilot_feedback_db
