databaseChangeLog:
  - changeSet:
      id: v1.40-add-waitlist-confirmation-token
      author: security
      comment: "Issue #194 - одноразовый непредсказуемый токен вместо угадываемого registrationId в /waitlist/confirm"
      changes:
        - addColumn:
            tableName: tournament_registrations_db
            columns:
              - column:
                  name: waitlist_confirmation_token
                  type: VARCHAR(64)
                  constraints:
                    nullable: true
        - createIndex:
            indexName: idx_tournament_registrations_waitlist_token
            tableName: tournament_registrations_db
            columns:
              - column:
                  name: waitlist_confirmation_token
