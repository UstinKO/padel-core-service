databaseChangeLog:
  - changeSet:
      id: v1.88-restore-phone-function-schema
      author: padel
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION public.player_claim_phone(raw text) RETURNS text
              LANGUAGE sql IMMUTABLE STRICT PARALLEL SAFE AS $$
                SELECT COALESCE(
                  public.player_claim_phone_argentina(raw),
                  CASE WHEN btrim(raw) ~ '^[+]?[0-9 ()-]+$'
                         AND digits ~ '^(00)?7[0-9]{10}$'
                    THEN right(digits, 11)
                  END
                )
                FROM (SELECT regexp_replace(raw, '[^0-9]', '', 'g') AS digits) phone
              $$;
      # Квалификация совместима с прежними JAR. При rollback не возвращаем
      # зависимость индекса от search_path и не меняем нормализацию телефонов.
      rollback:
        - sql:
            sql: SELECT 1;
