databaseChangeLog:
  - changeSet:
      id: v1.29-drop-old-categoria-nivel-constraint
      author: padel-core
      changes:
        - sql:
            sql: |
              ALTER TABLE tournaments_db
                DROP CONSTRAINT IF EXISTS chk_categoria_nivel_enum;
      rollback:
        - sql:
            sql: |
              ALTER TABLE tournaments_db
                ADD CONSTRAINT chk_categoria_nivel_enum
                CHECK (categoria_nivel IN (
                  'C9', 'C8', 'C7', 'C6', 'C5', 'PRINCIPIANTES',
                  'SUMA_15', 'SUMA_13',
                  'D7', 'D8', 'D7_D8', 'D6', 'C7_C6'
                ));
