map $http_upgrade $preview_connection {
    default upgrade;
    '' close;
}
map $http_host $preview_port {
    ~:(?<preview_incoming_port>[0-9]+)$ $preview_incoming_port;
    default 80;
}
server {
    listen 8080;
    server_name _;
    auth_basic "UI v2 Preview";
    auth_basic_user_file /run/secrets/gateway_passwords;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Environment preview always;
    proxy_hide_header X-Environment;
    proxy_hide_header X-Robots-Tag;
    client_max_body_size 7m;
    location = /__preview {
        alias /usr/share/nginx/html/preview.html;
        default_type text/html;
        add_header Cache-Control no-store;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Environment preview always;
    }
    location = /__preview/mail {
        proxy_pass http://preview-mail:8025/api/v1/messages;
        proxy_set_header Authorization "";
    }
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $preview_port;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $preview_connection;
        proxy_read_timeout 90s;
    }
}
