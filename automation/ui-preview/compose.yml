services:
  preview-db:
    image: postgres@sha256:29342cb52157b098821961d2c14eec3c019071f56a5d559e990cf07cf541ea9b
    environment:
      POSTGRES_DB: padel_ui_v2_preview
      POSTGRES_USER: preview
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
      - instance_id
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/preview.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U preview -d padel_ui_v2_preview']
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [isolated]
  preview-mail:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    networks: [isolated]
  app:
    build:
      context: ../..
      dockerfile: automation/ui-preview/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: preview
      APP_BASE_URL: http://127.0.0.1:${PREVIEW_PORT:?}
      APP_PREVIEW_REVISION: ${PREVIEW_REVISION:?}
    secrets:
      - source: database_password
        target: spring.datasource.password
      - source: instance_id
        target: app.preview.instance-id
      - source: fixture_password
        target: app.preview.fixture-password
      - source: jwt_secret
        target: jwt.secret
    depends_on:
      preview-db:
        condition: service_healthy
      preview-mail:
        condition: service_started
    networks: [isolated]
  gateway:
    image: nginx@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    ports:
      - '127.0.0.1:${PREVIEW_PORT:?}:8080'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/preview.html:ro
    secrets: [gateway_passwords]
    depends_on: [app]
    networks: [ingress, isolated]
networks:
  ingress:
  isolated:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
volumes:
  database:
secrets:
  database_password:
    file: ${PREVIEW_RUNTIME_DIR:?}/database_password
  instance_id:
    file: ${PREVIEW_RUNTIME_DIR:?}/instance_id
  fixture_password:
    file: ${PREVIEW_RUNTIME_DIR:?}/fixture_password
  jwt_secret:
    file: ${PREVIEW_RUNTIME_DIR:?}/jwt_secret
  gateway_passwords:
    file: ${PREVIEW_RUNTIME_DIR:?}/gateway_passwords
