map $http_upgrade $lab_connection {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=lab:1m rate=20r/s;
server {
    listen 80;
    server_name _;
    return 308 https://127.0.0.1:18443$request_uri;
}
server {
    listen 443 ssl;
    server_name localhost;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app padel-app:8080;
    ssl_certificate /run/secrets/lab.crt;
    ssl_certificate_key /run/secrets/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Environment swarm-lab always;
    client_max_body_size 7m;

    location = /__lab/edge {
        default_type text/plain;
        return 200 "$remote_addr|$scheme";
    }
    location = /__lab/ready {
        proxy_pass http://$app/actuator/health/readiness;
    }
    location /actuator { return 404; }
    location = /internal {
        add_header X-Lab-Internal-Blocked 1 always;
        return 404;
    }
    location ^~ /internal/ {
        add_header X-Lab-Internal-Blocked 1 always;
        return 404;
    }
    location /grafana/ { return 404; }
    location / {
        limit_req zone=lab burst=40 nodelay;
        proxy_pass http://$app$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 18443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lab_connection;
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
    }
}
