name: Apply confirmed Elo profile links
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/elo-profile-links.yml']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  enable:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/elo-profile-links-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply and verify Elo profile links
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          command_timeout: 480s
          script: |
            set -eu
            python3 - <<'PYRATING'
            import copy
            import hashlib
            import json
            import os
            from pathlib import Path
            import shutil
            import subprocess
            import sys
            import tempfile
            import zipfile

            ROOT = Path('/opt/padel-app')
            OLD = '2026-11-13-pilot24-5e97a1b'
            NEW = '2026-11-15-pilot24-aliases'
            LINKS = {'946': 903, '948': 637}
            IDS = {208,226,234,137,8,272,600,621,320,119,169,232,411,211,127,522,65,168,701,198,186,301,263,192}
            FILES = {
                'APP_RATING_PILOT_SNAPSHOT': ('pilot-snapshot.json', '6c70f3de9846b8eb4f12478f0bfe1391ecbd8f936c67ca2716b4e0c4154c7a89'),
                'APP_RATING_PILOT_HISTORY': ('rating-source.json', '4a4287e4cda6bcef4eb01807f71c8a156de2353d6c2cec3c21498f25cc96e17d'),
            }

            def env(container):
                return dict(line.split('=', 1) for line in container['Config']['Env'] if '=' in line)

            def verify_matches():
                sql = """
                BEGIN READ ONLY;
                SET LOCAL statement_timeout='20s';
                SELECT count(*) FROM player_padel_db WHERE id IN (637,903,946,948);
                SELECT count(*) FROM americano_matches_db m
                  JOIN tournaments_db t ON t.id=m.tournament_id
                 WHERE t.fecha_inicio > '2026-11-12' AND t.is_active AND t.estado <> 'CANCELADO'
                   AND m.status='COMPLETED'
                   AND (ARRAY[m.team1_player1_id,m.team1_player2_id,m.team2_player1_id,m.team2_player2_id] @> ARRAY[637,948]::bigint[]
                    OR ARRAY[m.team1_player1_id,m.team1_player2_id,m.team2_player1_id,m.team2_player2_id] @> ARRAY[903,946]::bigint[]);
                SELECT count(*) FROM king_of_court_match_result_db m
                  JOIN king_of_court_court_db c ON c.id=m.court_id
                  JOIN king_of_court_round_db r ON r.id=c.round_id
                  JOIN tournament_king_of_court_db k ON k.id=r.tournament_king_id
                  JOIN tournaments_db t ON t.id=k.tournament_id
                 WHERE t.fecha_inicio > '2026-11-12' AND t.is_active AND t.estado <> 'CANCELADO'
                   AND r.is_completed
                   AND (ARRAY[m.winner1_id,m.winner2_id,m.loser1_id,m.loser2_id] @> ARRAY[637,948]::bigint[]
                    OR ARRAY[m.winner1_id,m.winner2_id,m.loser1_id,m.loser2_id] @> ARRAY[903,946]::bigint[]);
                COMMIT;
                """
                result = subprocess.run(['docker','exec','padel-postgres','sh','-ec',
                    'exec psql -qXAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"',
                    'rating-alias-check',sql], capture_output=True, text=True, check=True, timeout=30)
                assert result.stdout.split() == ['4','0','0'], 'identity or match collision preflight'

            def updated_files():
                home = ROOT/'rating-pilot'
                assert home.is_dir() and not home.is_symlink()
                folder = home/NEW
                data = {}
                for filename, digest in FILES.values():
                    source = home/OLD/filename
                    raw = source.read_bytes()
                    assert hashlib.sha256(raw).hexdigest() == digest, 'historical file changed'
                    parsed = json.loads(raw)
                    aliases = parsed['history']['aliases'] if 'history' in parsed else parsed['aliases']
                    assert not set(aliases).intersection(LINKS)
                    aliases.update(LINKS)
                    data[filename] = json.dumps(parsed, ensure_ascii=False, separators=(',', ':')).encode()
                assert json.loads(data['pilot-snapshot.json'])['aliases'] == json.loads(data['rating-source.json'])['history']['aliases']
                if not folder.exists():
                    stage = Path(tempfile.mkdtemp(prefix='aliases-', dir=home))
                    try:
                        for filename, raw in data.items():
                            path = stage/filename
                            path.write_bytes(raw)
                            path.chmod(0o444)
                        stage.chmod(0o755)
                        stage.rename(folder)
                    finally:
                        if stage.exists():
                            shutil.rmtree(stage)
                assert not folder.is_symlink()
                for filename, raw in data.items():
                    assert not (folder/filename).is_symlink() and (folder/filename).read_bytes() == raw

            def main():
                os.umask(0o077)
                with tempfile.TemporaryDirectory(dir=ROOT/'temp') as modules:
                    with zipfile.ZipFile(ROOT/'temp/release-runner.pyz') as archive:
                        for name in ('artifact.py','docker_adapter.py','smoke.py','transaction.py','production.py'):
                            (Path(modules)/name).write_bytes(archive.read(name))
                    sys.path.insert(0, modules)
                    from production import Production, run
                    from transaction import Releases, install_signals
                    install_signals()
                    state = ROOT/'release-state'
                    current = json.loads((state/'current.json').read_text())
                    assert current['managed']
                    folder = ROOT/'releases'/current['id']
                    config = json.loads(run(['docker','compose','--project-directory',str(ROOT),'--env-file',
                        str(folder/'environment'),'-f',str(folder/'compose.json'),'config','--format','json']))

                    class AliasRelease(Production):
                        def smoke(self, record):
                            super().smoke(record)
                            live = self.container()
                            assert live['Image'] == before['Image']
                            assert env(live) == (previous if record['id'] == current['id'] else expected)
                            assert sorted(live['Mounts'],key=lambda m:m['Destination']) == sorted(before['Mounts'],key=lambda m:m['Destination'])
                            response = self.fetch(record)('/ranking')
                            assert response.status == 200 and b'id="elo-leaderboard"' not in response.body

                    adapter = AliasRelease(ROOT,ROOT/'releases',config['name'],'padel-app')
                    releases = Releases(state,adapter)
                    with releases.locked():
                        assert not releases.read('pending') and releases.read('current') == current
                        adapter.validate(current)
                        before = adapter.container()
                        previous = env(before)
                        assert previous['APP_RELEASE_REVISION'] == current['revision']
                        assert set(map(int,previous['APP_RATING_PILOT_PLAYER_IDS'].split(','))) == IDS
                        assert not IDS.intersection(map(int, LINKS)) and not IDS.intersection(LINKS.values())
                        assert all(previous.get(k) == 'true' for k in
                            ('APP_RATING_PILOT_ENABLED','APP_RATING_PILOT_AUTO_REFRESH','APP_RATING_PILOT_FEEDBACK_ENABLED'))
                        mount = next(m for m in before['Mounts'] if m['Destination'] == '/app/rating-pilot')
                        assert not mount['RW'] and mount['Source'] == str(ROOT/'rating-pilot')
                        dotenv = (ROOT/'.env').read_bytes()
                        assert hashlib.sha256(dotenv).hexdigest() == current['environmentSha256']
                        replacements = {k: f'/app/rating-pilot/{NEW}/{file}' for k,(file,_) in FILES.items()}
                        for key,(file,_) in FILES.items():
                            old_path = f'/app/rating-pilot/{OLD}/{file}'
                            assert previous[key] == old_path and dotenv.decode().splitlines().count(key+'='+old_path) == 1
                            dotenv = dotenv.replace((key+'='+old_path).encode(),(key+'='+replacements[key]).encode(),1)
                        verify_matches()
                        updated_files()
                        expected = dict(previous, **replacements)
                        candidate_config = copy.deepcopy(config)
                        candidate_config['services']['padel-app']['environment'].update(replacements)
                        manifest = json.loads((folder/'manifest.json').read_text())
                        candidate = adapter.prepare(folder/'app.jar',manifest,current['image'],candidate_config,dotenv)
                        releases._deploy_locked(candidate)
                        print('RATING_ALIASES_ACTIVE='+json.dumps({'aliases': LINKS,'pilotPlayers': len(IDS),
                            'autoRefresh': True,'feedback': True,'revision': current['revision'],'record': candidate['id']}))

            if __name__ == '__main__':
                try:
                    main()
                except Exception as error:
                    print('Rating alias rollout failed: '+type(error).__name__ + (f' ({error})' if isinstance(error, AssertionError) else ''),file=sys.stderr)
                    sys.exit(1)
            PYRATING
