name: Pilot disabled release staging
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/pilot-delivery.yml']
permissions:
  contents: read
concurrency:
  group: pilot-disabled-release-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/LFPT-1096-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare authorized disabled pilot release
        env:
          PACKAGE_COMMIT: ${{ github.event.pull_request.head.sha }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          envs: PACKAGE_COMMIT
          timeout: 60s
          command_timeout: 180s
          script: |
            set -eu
            umask 077
            python3 - <<'PYDELIVERY'
            import json,re,subprocess
            from pathlib import Path
            
            root=Path('/opt/padel-app')
            def run(args):
                r=subprocess.run(args,capture_output=True,text=True,timeout=30)
                if r.returncode: raise RuntimeError('Read failed')
                return r.stdout
            c=json.loads(run(['docker','inspect','padel-core-app']))[0]
            env=dict(x.split('=',1) for x in c['Config']['Env'] if '=' in x)
            secrets=[v for k,v in env.items() if any(s in k for s in ['PASSWORD','SECRET','TOKEN','KEY']) and len(v)>3]
            def safe(s):
                for v in secrets:s=s.replace(v,'[redacted]')
                s=re.sub(r'[\w.+-]+@[\w.-]+','[email]',s)
                s=re.sub(r'(?i)(password|token|secret)(\s*[=:]\s*)\S+',r'\1\2[redacted]',s)
                return s[:1200]
            print('CURRENT='+json.dumps({'revision':env.get('APP_RELEASE_REVISION'),'running':c['State']['Running'],'pilot':env.get('APP_RATING_PILOT_ENABLED','absent'),'autoRefresh':env.get('APP_RATING_PILOT_AUTO_REFRESH','absent')}))
            for file in (root/'logs').glob('*.log'):
                with file.open('rb') as f:
                    f.seek(max(0,file.stat().st_size-3000000)); data=f.read().decode(errors='replace')
                selected=[l for l in data.splitlines() if any(s in l for s in ['ERROR','Caused by:','APPLICATION FAILED','Description:','Action:'])]
                print('DIAGNOSTIC='+json.dumps({'file':file.name,'lines':[safe(l) for l in selected[-45:]]}))
            db=json.loads(run(['docker','inspect','padel-postgres']))[0]
            db_env=dict(x.split('=',1) for x in db['Config']['Env'] if '=' in x)
            query="SELECT id,fecha_registro,oauth2_user FROM player_padel_db WHERE id=8 OR lower(email)='gurulev.eu1@gmail.com' ORDER BY id"
            result=run(['docker','exec','padel-postgres','psql','-X','-A','-t','-U',db_env['POSTGRES_USER'],'-d',db_env['POSTGRES_DB'],'-c',query])
            print('ACCOUNT_ID_AND_CREATED='+result.strip().replace('\n',';'))
            PYDELIVERY
