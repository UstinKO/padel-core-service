name: Pilot disabled release staging
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/pilot-delivery.yml']
permissions:
  contents: read
concurrency:
  group: pilot-disabled-release-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/LFPT-1096-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare authorized disabled pilot release
        env:
          PACKAGE_COMMIT: ${{ github.event.pull_request.head.sha }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          envs: PACKAGE_COMMIT
          timeout: 60s
          command_timeout: 180s
          script: |
            set -eu
            umask 077
            python3 - <<'PYDELIVERY'
            import fcntl
            import hashlib
            import json
            from pathlib import Path
            import subprocess
            import urllib.request
            
            ROOT=Path('/opt/padel-app')
            STAGE=ROOT/'.pilot-delivery-20261113-24'
            REVISION='3cb3e146a421df4adbe18cd0d5be78f8d6b6ca86'
            VERSION='2026-11-13-pilot24-5e97a1b'
            
            def run(args):
                r=subprocess.run(args,capture_output=True,text=True,timeout=30)
                if r.returncode:raise RuntimeError('Verification command failed: '+args[0])
                return r.stdout
            
            def main():
                with (ROOT/'release-state'/'lock').open('a') as lock:
                    fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
                    container=json.loads(run(['docker','inspect','padel-core-app']))[0]
                    env=dict(e.split('=',1) for e in container['Config']['Env'] if '=' in e)
                    assert env['APP_RELEASE_REVISION']==REVISION
                    assert env['APP_RATING_PILOT_ENABLED']==env['APP_RATING_PILOT_AUTO_REFRESH']=='false'
                    assert env.get('APP_SPA_ROUTES') in ('','[]')
                    ids=set(map(int,env['APP_RATING_PILOT_PLAYER_IDS'].split(',')))
                    assert len(ids)==24 and 927 not in ids and 272 in ids
                    current=json.loads((ROOT/'release-state'/'current.json').read_text())
                    assert current['revision']==REVISION
                    mount=[m for m in container['Mounts'] if m['Destination']=='/app/rating-pilot']
                    assert len(mount)==1 and not mount[0]['RW']
                    installed=json.loads((STAGE/'installed.json').read_text())
                    for name,checksum in installed['files'].items():
                        path=ROOT/'rating-pilot'/VERSION/name
                        assert hashlib.sha256(path.read_bytes()).hexdigest()==checksum
                        run(['docker','exec','padel-core-app','test','-r',f'/app/rating-pilot/{VERSION}/{name}'])
                    port=container['NetworkSettings']['Ports'][env.get('SERVER_PORT','8080')+'/tcp'][0]['HostPort']
                    responses={}
                    for path in ['/actuator/health/readiness','/','/login','/ranking']:
                        with urllib.request.urlopen('http://127.0.0.1:'+port+path,timeout=15) as response:
                            body=response.read();assert response.status==200
                            assert response.headers['X-Release-Revision']==REVISION
                            assert b'/css/elo-preview.css' not in body and b'/js/elo-preview' not in body
                            responses[path]={'status':response.status,'revisionMatches':True,'pilotAssetsAbsent':True}
                    for name in ['delivery.key','delivery.crt','payload.cms']:
                        path=STAGE/name
                        if path.exists():
                            assert path.is_file() and not path.is_symlink();path.unlink()
                    report={'revision':REVISION,'running':container['State']['Running'],'pilotEnabled':False,'autoRefresh':False,'selectedPlayers':24,'readOnlyMountActive':True,'filesVerified':installed['files'],'readableInDeployedContainer':True,'http':responses,'temporaryDeliveryKeyRemoved':not (STAGE/'delivery.key').exists(),'databaseRatingWrites':False}
                    (STAGE/'verified.json').write_text(json.dumps(report));(STAGE/'verified.json').chmod(0o600)
                    print('PILOT_DEPLOYMENT_VERIFIED='+json.dumps(report,sort_keys=True))
            
            if __name__=='__main__':
                try:main()
                except Exception as error:
                    print('PILOT_VERIFY_ERROR='+type(error).__name__)
                    raise SystemExit(1)
            PYDELIVERY
