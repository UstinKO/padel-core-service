name: Deploy to Production
# При запуске оркестратором автомержа (pipeline-merge.yml, LFPT-0579) в имени прогона — номер PR:
# по нему оркестратор и движок задач находят деплой конкретного PR. Пустое значение (push)
# оставляет имя по умолчанию — первую строку сообщения коммита.
run-name: "${{ inputs.pr && format('Deploy PR #{0}', inputs.pr) || '' }}"

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'specs/**'
      - '.claude/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'docs/**'
  # Мерж от GITHUB_TOKEN не порождает push-прогон, поэтому оркестратор запускает деплой явно.
  workflow_dispatch:
    inputs:
      pr:
        description: Номер влитого PR, который деплоится
        required: false
        type: string

# Деплои строго по одному: следующий ждёт завершения текущего, не отменяя его.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build JAR with version
        run: |
          mvn clean package -DskipTests
          echo "${{ github.sha }}" > target/version.txt
          echo "Build timestamp: $(date)" >> target/version.txt
          echo "Listing target directory:"
          ls -la target/

      - name: Copy jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "target/*.jar,target/version.txt"
          target: "/opt/padel-app/temp/"
          strip_components: 1

      - name: Deploy to server
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          timeout: 1200s
          command_timeout: 1200s
          script: |
            set -e

            echo "🔧 Starting deployment process..."

            # Функция для отката
            rollback() {
              echo "⚠️ Rolling back to previous version..."
              if [ -f "/opt/padel-app/app.jar.backup" ]; then
                cp /opt/padel-app/app.jar.backup /opt/padel-app/app.jar
                echo "🔄 Restored previous JAR"
            
                cd /opt/padel-app
                docker compose build --no-cache padel-app
                docker compose up -d --no-deps padel-app
            
                echo "✅ Rollback completed"
              else
                echo "❌ No backup found for rollback"
              fi
            }

            # Сохраняем текущую версию для отката
            if [ -f "/opt/padel-app/app.jar" ]; then
              cp /opt/padel-app/app.jar /opt/padel-app/app.jar.backup
              echo "💾 Current version backed up"
            fi

            # Находим основной jar файл
            MAIN_JAR=$(ls /opt/padel-app/temp/padel-core-service-*.jar | grep -v "original" | head -1)

            if [ -z "$MAIN_JAR" ]; then
              echo "❌ No main JAR file found in temp directory!"
              echo "Contents of temp directory:"
              ls -la /opt/padel-app/temp/
              exit 1
            fi

            echo "📦 Found JAR file: $(basename $MAIN_JAR)"

            # Копируем новый JAR
            cp "$MAIN_JAR" /opt/padel-app/app.jar

            # Копируем version.txt
            if [ -f "/opt/padel-app/temp/version.txt" ]; then
              cp /opt/padel-app/temp/version.txt /opt/padel-app/version.txt
              echo "📄 Version file copied:"
              cat /opt/padel-app/version.txt
            fi

            # Сохраняем информацию о версии
            echo "$(basename $MAIN_JAR)" > /opt/padel-app/new_version.txt
            echo "Deployed at: $(date)" >> /opt/padel-app/new_version.txt

            # Переходим в директорию приложения
            cd /opt/padel-app

            # Пересобираем образ
            echo "🏗️ Building new Docker image..."
            if ! docker compose build --no-cache padel-app; then
              echo "❌ Docker build failed!"
              rollback
              exit 1
            fi

            # Перезапускаем приложение
            echo "🔄 Restarting application..."
            if ! docker compose up -d --no-deps padel-app; then
              echo "❌ Failed to restart application container!"
              rollback
              exit 1
            fi

            # LFPT-331: здоровье проверяется только реальным ответом readiness-пробы.
            # Раньше критерием был grep "Started PadelCoreServiceApplication" в docker logs --tail=N:
            # при шумном логе строка выталкивалась из окна и здоровый деплой откатывался, а упавшее
            # после старта приложение считалось здоровым. readiness, а не общий /actuator/health —
            # чтобы недоступность SMTP (компонент mail) не откатывала рабочее приложение.
            DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            READINESS_URL="http://localhost:8080/actuator/health/readiness"
            MAX_ATTEMPTS=60
            POLL_INTERVAL=5
            HEALTHY="false"

            echo "🏥 Waiting for readiness ($READINESS_URL, up to $((MAX_ATTEMPTS * POLL_INTERVAL))s)..."
            for i in $(seq 1 $MAX_ATTEMPTS); do
              CONTAINER_STATE=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' padel-core-app 2>/dev/null || echo "missing 0")
              if [ "${CONTAINER_STATE%% *}" != "running" ] || [ "${CONTAINER_STATE##* }" != "0" ]; then
                echo "❌ Application container is not running steadily (state/restarts: $CONTAINER_STATE)"
                break
              fi

              HTTP_CODE=$(docker compose exec -T padel-app curl -s -o /dev/null -w "%{http_code}" "$READINESS_URL" 2>/dev/null || true)
              if [ "$HTTP_CODE" = "200" ]; then
                HEALTHY="true"
                echo "✅ Readiness 200 on attempt $i/$MAX_ATTEMPTS"
                break
              fi

              echo "⏳ Attempt $i/$MAX_ATTEMPTS: readiness=${HTTP_CODE:-no response}"
              sleep $POLL_INTERVAL
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Application is not ready — rolling back"
              echo "📋 Errors since deploy start:"
              docker compose logs padel-app --since "$DEPLOY_STARTED_AT" 2>/dev/null \
                | grep -vE '\|-(INFO|WARN) in ' \
                | grep -E "ERROR|Exception|Caused by|APPLICATION FAILED" | head -n 60 || true
              echo "📋 Last application log lines:"
              docker compose logs padel-app --since "$DEPLOY_STARTED_AT" --tail=60 || true
              rollback
              exit 1
            fi

            # Если всё хорошо, обновляем current_version
            mv /opt/padel-app/new_version.txt /opt/padel-app/current_version.txt
            echo "✅ New version is healthy!"

            # Удаляем бэкап после успешного деплоя
            rm -f /opt/padel-app/app.jar.backup
            echo "🧹 Backup removed"

            # Очищаем temp директорию
            rm -rf /opt/padel-app/temp/*
            echo "🧹 Temp directory cleaned"

            # Удаляем старые неиспользуемые образы
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment process completed successfully!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          script: |
            echo "🏥 Running final health check..."
            
            cd /opt/padel-app
            
            HTTP_CODE=$(docker compose exec -T padel-app curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health/readiness 2>/dev/null || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Readiness 200"
              echo "📋 Current version:"
              cat /opt/padel-app/current_version.txt 2>/dev/null || echo "Unknown"
              echo "📋 Container status:"
              docker compose ps
              echo "📋 Last 20 lines of logs:"
              docker compose logs padel-app --tail=20
            else
              echo "❌ Readiness check failed: ${HTTP_CODE:-no response}"
              docker compose ps
              docker compose logs padel-app --tail=50
              exit 1
            fi

      - name: Purge Cloudflare cache
        if: success()
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          if r.get('success'):
              print('✅ Cloudflare cache purged successfully')
          else:
              print('⚠️ Cloudflare purge failed:', r.get('errors'))
              sys.exit(1)
          "

      - name: Notify success
        if: success()
        run: |
          echo "🎉 DEPLOYMENT SUCCESSFUL! 🎉"
          echo "=================================="
          echo "✅ Application successfully deployed to production!"
          echo "📦 Version: $(cat target/version.txt 2>/dev/null | head -1 || echo 'unknown')"
          echo "🕐 Build time: $(date)"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "🌍 Server: ${{ secrets.SERVER_HOST }}"
          echo "=================================="

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED! ❌"
          echo "=================================="
          echo "❌ Deployment to production failed!"
          echo "🕐 Time: $(date)"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "🌍 Server: ${{ secrets.SERVER_HOST }}"
          echo "=================================="
          echo "⚠️ Check the 'Deploy to server' step logs above for '🔄 Rolling back to previous version' to see whether an automatic rollback actually ran and whether it succeeded — it does not always run on every failure path."
          echo "⚠️ Verify the actual production state directly (docker ps / current_version.txt / actuator/health on the server) before assuming anything about which version is running."
          exit 1

  # Деплой PR конвейера запускает pipeline-merge.yml через gh workflow run от GITHUB_TOKEN — у такого
  # прогона GitHub не порождает workflow_run, и оркестратор не узнавал, что деплой закончился: фронт
  # после бэка ждал случайного события больше часа, а упавший деплой не останавливал автомерж (LFPT-0685).
  # Будим его явно — workflow_dispatch от GITHUB_TOKEN разрешён. И при успехе, и при сбое.
  pipeline-next:
    needs: deploy
    if: ${{ always() && inputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wake pipeline-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pipeline-merge.yml --ref master -f deploy_run_id="${GITHUB_RUN_ID}"

  # Архивация спек задеплоенной задачи: specs/features → specs/done, specs/requests → specs/done/requests.
  # Отдельный job: сбой здесь не значит, что упал деплой, и не красит прогон в failure
  # (continue-on-error), но виден как упавший job и как ::error:: в сводке прогона.
  # PR мержится сразу — весь диф в specs/** (§9 GIT_WORKFLOW.md), deploy.yml на него не запускается (paths-ignore).
  # Требует включённого "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General).
  archive-specs:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Archive specs of deployed task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Заголовок задеплоенного коммита — через API: у workflow_dispatch нет head_commit.
          subject=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.message' | head -n1)
          short_sha="${GITHUB_SHA::7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          archived=$(.github/bin/archive-specs.sh "$subject")
          if [ -z "$archived" ]; then
            echo "ℹ️ Для коммита «${subject}» нечего архивировать."
            exit 0
          fi
          echo "Архивирую:"; echo "$archived"

          git add -A specs
          # core.quotepath=off: иначе пути с кириллицей приходят как "specs/...\320\262..." и ложно не проходят grep (LFPT-0737)
          if git -c core.quotepath=off diff --cached --name-only | grep -v '^specs/'; then
            echo "::error::Диф архивации вышел за пределы specs/ — PR не создаю."
            exit 1
          fi

          branch="docs/archive-specs-${short_sha}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "docs: архивировать спеки после деплоя ${short_sha}" \
            -m "Деплой «${subject}» прошёл успешно: ${run_url}"
          git push -q origin "$branch"

          body=$(printf 'Деплой «%s» (`%s`) прошёл успешно: %s\n\nПеренесено:\n%s\n\nДиф только в `specs/**` — мерж без ревью по §9 `GIT_WORKFLOW.md`.' \
            "$subject" "$short_sha" "$run_url" "$(sed 's/^/- `/; s/$/`/' <<<"$archived")")
          pr_url=$(gh pr create --base master --head "$branch" \
            --title "docs: архивировать спеки после деплоя ${short_sha}" --body "$body")
          gh pr merge "$pr_url" --squash --delete-branch
          echo "✅ Спеки заархивированы: ${pr_url}"

      - name: Report archival failure
        if: failure()
        run: |
          echo "::error::Архивация спек после деплоя не удалась — перенеси спеки в specs/done вручную (Шаг 7 develop-feature.md). Сам деплой прошёл успешно."
