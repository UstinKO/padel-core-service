name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build JAR with version
        run: |
          mvn clean package -DskipTests
          echo "${{ github.sha }}" > target/version.txt
          echo "Build timestamp: $(date)" >> target/version.txt
          echo "Listing target directory:"
          ls -la target/

      - name: Copy jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "target/*.jar,target/version.txt"
          target: "/opt/padel-app/temp/"
          strip_components: 1

      - name: Deploy to server
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          timeout: 1200s
          command_timeout: 1200s
          script: |
            set -e

            echo "🔧 Starting deployment process..."

            # Функция для отката
            rollback() {
              echo "⚠️ Rolling back to previous version..."
              if [ -f "/opt/padel-app/app.jar.backup" ]; then
                cp /opt/padel-app/app.jar.backup /opt/padel-app/app.jar
                echo "🔄 Restored previous JAR"
            
                cd /opt/padel-app
                docker compose build --no-cache padel-app
                docker compose up -d --no-deps padel-app
            
                echo "✅ Rollback completed"
              else
                echo "❌ No backup found for rollback"
              fi
            }

            # Сохраняем текущую версию для отката
            if [ -f "/opt/padel-app/app.jar" ]; then
              cp /opt/padel-app/app.jar /opt/padel-app/app.jar.backup
              echo "💾 Current version backed up"
            fi

            # Находим основной jar файл
            MAIN_JAR=$(ls /opt/padel-app/temp/padel-core-service-*.jar | grep -v "original" | head -1)

            if [ -z "$MAIN_JAR" ]; then
              echo "❌ No main JAR file found in temp directory!"
              echo "Contents of temp directory:"
              ls -la /opt/padel-app/temp/
              exit 1
            fi

            echo "📦 Found JAR file: $(basename $MAIN_JAR)"

            # Копируем новый JAR
            cp "$MAIN_JAR" /opt/padel-app/app.jar

            # Копируем version.txt
            if [ -f "/opt/padel-app/temp/version.txt" ]; then
              cp /opt/padel-app/temp/version.txt /opt/padel-app/version.txt
              echo "📄 Version file copied:"
              cat /opt/padel-app/version.txt
            fi

            # Сохраняем информацию о версии
            echo "$(basename $MAIN_JAR)" > /opt/padel-app/new_version.txt
            echo "Deployed at: $(date)" >> /opt/padel-app/new_version.txt

            # Переходим в директорию приложения
            cd /opt/padel-app

            # Пересобираем образ
            echo "🏗️ Building new Docker image..."
            if ! docker compose build --no-cache padel-app; then
              echo "❌ Docker build failed!"
              rollback
              exit 1
            fi

            # Перезапускаем приложение
            echo "🔄 Restarting application..."
            if ! docker compose up -d --no-deps padel-app; then
              echo "❌ Failed to restart application container!"
              rollback
              exit 1
            fi

            # Ждем запуска (60 секунд)
            echo "⏳ Waiting for application to start (60 seconds)..."
            sleep 60

            # Проверяем, запустился ли контейнер
            if ! docker ps | grep -q padel-core-app; then
              echo "❌ Application container failed to start!"
              echo "📋 Container logs:"
              docker compose logs padel-app --tail=50
              rollback
              exit 1
            fi

            # Проверяем логи на наличие признаков успешного запуска
            echo "🔍 Checking application logs for successful startup..."
            if docker compose logs padel-app --tail=50 | grep -q "Started PadelCoreServiceApplication"; then
              echo "✅ Application started successfully!"
            else
              echo "⚠️ Application started but may not be fully ready, continuing health check..."
            fi

            # Проверяем health endpoint (максимум 60 попыток по 10 секунд)
            echo "🏥 Checking health endpoint (will wait up to 10 minutes)..."
            HEALTH_CHECK="failed"
            MAX_ATTEMPTS=60
            START_TIME=$(date +%s)
            
            for i in $(seq 1 $MAX_ATTEMPTS); do
              echo "⏳ Health check attempt $i/$MAX_ATTEMPTS..."
            
              if docker compose logs padel-app --tail=20 | grep -q "Started PadelCoreServiceApplication"; then
                echo "✅ Application startup detected in logs!"
                sleep 5
                break
              fi
            
              HEALTH_CHECK=$(docker compose exec padel-app curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "failed")
            
              if [ "$HEALTH_CHECK" = "200" ]; then
                echo "✅ Health check passed!"
                break
              fi
            
              if [ $i -lt $MAX_ATTEMPTS ]; then
                ELAPSED=$(( $(date +%s) - START_TIME ))
                REMAINING=$(( (MAX_ATTEMPTS - i) * 10 ))
                echo "⏳ Waiting 10 seconds before next attempt... ($REMAINING seconds remaining, total elapsed: ${ELAPSED}s)"
                sleep 10
              fi
            done

            # Финальная проверка
            if [ "$HEALTH_CHECK" != "200" ]; then
              if docker compose logs padel-app --tail=50 | grep -q "Started PadelCoreServiceApplication"; then
                echo "⚠️ Health check failed but application appears to be running!"
                echo "✅ Continuing deployment (application is running)"
              else
                echo "❌ Health check failed and application is not running!"
                echo "📋 Application logs:"
                docker compose logs padel-app --tail=50
                rollback
                exit 1
              fi
            fi

            # Если всё хорошо, обновляем current_version
            mv /opt/padel-app/new_version.txt /opt/padel-app/current_version.txt
            echo "✅ New version is healthy!"

            # Удаляем бэкап после успешного деплоя
            rm -f /opt/padel-app/app.jar.backup
            echo "🧹 Backup removed"

            # Очищаем temp директорию
            rm -rf /opt/padel-app/temp/*
            echo "🧹 Temp directory cleaned"

            # Удаляем старые неиспользуемые образы
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment process completed successfully!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          script: |
            echo "🏥 Running final health check..."
            
            cd /opt/padel-app
            
            if docker ps | grep -q padel-core-app; then
              echo "✅ Container is running"
              echo "📋 Current version:"
              cat /opt/padel-app/current_version.txt 2>/dev/null || echo "Unknown"
              echo "📋 Container status:"
              docker compose ps
              echo "📋 Last 20 lines of logs:"
              docker compose logs padel-app --tail=20
            else
              echo "❌ Container is not running!"
              docker compose ps
              docker compose logs padel-app --tail=50
              exit 1
            fi

      - name: Purge Cloudflare cache
        if: success()
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          if r.get('success'):
              print('✅ Cloudflare cache purged successfully')
          else:
              print('⚠️ Cloudflare purge failed:', r.get('errors'))
              sys.exit(1)
          "

      - name: Notify success
        if: success()
        run: |
          echo "🎉 DEPLOYMENT SUCCESSFUL! 🎉"
          echo "=================================="
          echo "✅ Application successfully deployed to production!"
          echo "📦 Version: $(cat target/version.txt 2>/dev/null | head -1 || echo 'unknown')"
          echo "🕐 Build time: $(date)"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "🌍 Server: ${{ secrets.SERVER_HOST }}"
          echo "=================================="

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED! ❌"
          echo "=================================="
          echo "❌ Deployment to production failed!"
          echo "🕐 Time: $(date)"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "🌍 Server: ${{ secrets.SERVER_HOST }}"
          echo "=================================="
          echo "⚠️ Check the 'Deploy to server' step logs above for '🔄 Rolling back to previous version' to see whether an automatic rollback actually ran and whether it succeeded — it does not always run on every failure path."
          echo "⚠️ Verify the actual production state directly (docker ps / current_version.txt / actuator/health on the server) before assuming anything about which version is running."
          exit 1