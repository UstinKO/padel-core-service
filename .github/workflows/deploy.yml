name: Deploy to Production
# При запуске оркестратором автомержа (pipeline-merge.yml, LFPT-0579) в имени прогона — номер PR:
# по нему оркестратор и движок задач находят деплой конкретного PR. Пустое значение (push)
# оставляет имя по умолчанию — первую строку сообщения коммита.
run-name: "${{ inputs.pr && format('Deploy PR #{0}', inputs.pr) || '' }}"

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'specs/**'
      - '.claude/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'docs/**'
  # Мерж от GITHUB_TOKEN не порождает push-прогон, поэтому оркестратор запускает деплой явно.
  workflow_dispatch:
    inputs:
      pr:
        description: Номер влитого PR, который деплоится
        required: false
        type: string

# Деплои строго по одному: следующий ждёт завершения текущего, не отменяя его.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build verified release artifact
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests
          python3 automation/releases/build.py --revision "$GITHUB_SHA"

      - name: Copy immutable release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "target/release-*.tar.gz,target/release-runner.pyz"
          target: "/opt/padel-app/temp/"
          strip_components: 1

      - name: Activate and verify release
        id: deploy
        env:
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
          GUEST_CLAIM_WHATSAPP_URL: ${{ vars.GUEST_CLAIM_WHATSAPP_URL }}
          RELEASE_REVISION: ${{ github.sha }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          envs: META_CAPI_ACCESS_TOKEN,RELEASE_REVISION,GUEST_CLAIM_WHATSAPP_URL
          timeout: 1200s
          command_timeout: 1200s
          script: |
            set -eu
            umask 077
            python3 /opt/padel-app/temp/release-runner.pyz deploy \
              --root /opt/padel-app \
              --bundle "/opt/padel-app/temp/release-${RELEASE_REVISION}.tar.gz" \
              --revision "$RELEASE_REVISION"

      - name: Purge Cloudflare cache
        if: success()
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          if r.get('success'):
              print('✅ Cloudflare cache purged successfully')
          else:
              print('⚠️ Cloudflare purge failed:', r.get('errors'))
              sys.exit(1)
          "

      - name: Restore release after post-deploy failure
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        env:
          RELEASE_REVISION: ${{ github.sha }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          envs: RELEASE_REVISION
          script: |
            set -eu
            python3 /opt/padel-app/temp/release-runner.pyz rollback \
              --root /opt/padel-app --revision "$RELEASE_REVISION"

      - name: Notify success
        if: success()
        run: |
          echo "Деплой проверен: ${GITHUB_SHA}"

      - name: Notify failure
        if: failure()
        run: |
          echo "Деплой завершился ошибкой: ${GITHUB_SHA}"
          echo "Результат восстановления указан в шаге Activate and verify release или Restore release after post-deploy failure."
          echo "Проверьте current_version.txt и состояние приложения перед повторным выпуском."
          exit 1

  # Деплой PR конвейера запускает pipeline-merge.yml через gh workflow run от GITHUB_TOKEN — у такого
  # прогона GitHub не порождает workflow_run, и оркестратор не узнавал, что деплой закончился: фронт
  # после бэка ждал случайного события больше часа, а упавший деплой не останавливал автомерж (LFPT-0685).
  # Будим его явно — workflow_dispatch от GITHUB_TOKEN разрешён. И при успехе, и при сбое.
  pipeline-next:
    needs: deploy
    if: ${{ always() && inputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wake pipeline-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pipeline-merge.yml --ref master -f deploy_run_id="${GITHUB_RUN_ID}"

  # Архивация спек задеплоенной задачи: specs/features → specs/done, specs/requests → specs/done/requests.
  # Отдельный job: сбой здесь не значит, что упал деплой, и не красит прогон в failure
  # (continue-on-error), но виден как упавший job и как ::error:: в сводке прогона.
  # PR мержится сразу — весь диф в specs/** (§9 GIT_WORKFLOW.md), deploy.yml на него не запускается (paths-ignore).
  # Требует включённого "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General).
  archive-specs:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Archive specs of deployed task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Заголовок задеплоенного коммита — через API: у workflow_dispatch нет head_commit.
          subject=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.message' | head -n1)
          short_sha="${GITHUB_SHA::7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          archived=$(.github/bin/archive-specs.sh "$subject")
          if [ -z "$archived" ]; then
            echo "ℹ️ Для коммита «${subject}» нечего архивировать."
            exit 0
          fi
          echo "Архивирую:"; echo "$archived"

          git add -A specs
          # core.quotepath=off: иначе пути с кириллицей приходят как "specs/...\320\262..." и ложно не проходят grep (LFPT-0737)
          if git -c core.quotepath=off diff --cached --name-only | grep -v '^specs/'; then
            echo "::error::Диф архивации вышел за пределы specs/ — PR не создаю."
            exit 1
          fi

          branch="docs/archive-specs-${short_sha}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "docs: архивировать спеки после деплоя ${short_sha}" \
            -m "Деплой «${subject}» прошёл успешно: ${run_url}"
          git push -q origin "$branch"

          # Обратные кавычки — буквальная разметка Markdown.
          # shellcheck disable=SC2016
          body=$(printf 'Деплой «%s» (`%s`) прошёл успешно: %s\n\nПеренесено:\n%s\n\nДиф только в `specs/**` — мерж без ревью по §9 `GIT_WORKFLOW.md`.' \
            "$subject" "$short_sha" "$run_url" "$(sed 's/^/- `/; s/$/`/' <<<"$archived")")
          pr_url=$(gh pr create --base master --head "$branch" \
            --title "docs: архивировать спеки после деплоя ${short_sha}" --body "$body")
          gh pr merge "$pr_url" --squash --delete-branch
          echo "✅ Спеки заархивированы: ${pr_url}"

      - name: Report archival failure
        if: failure()
        run: |
          echo "::error::Архивация спек после деплоя не удалась — перенеси спеки в specs/done вручную (Шаг 7 develop-feature.md). Сам деплой прошёл успешно."
