name: PR Check

on:
  pull_request:
  # Повторная проверка перед автомержем (LFPT-0579): оркестратор pipeline-merge.yml
  # прогоняет тот же build на свежем refs/pull/N/merge.
  workflow_call:
    inputs:
      ref:
        description: Что проверять, например refs/pull/123/merge
        required: true
        type: string

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Check frontend
        run: pnpm --dir frontend check
      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install chromium
      - name: Check preview in desktop and mobile browsers
        run: pnpm --dir frontend test:e2e

  build:
    needs: frontend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: player_padel_db
          POSTGRES_USER: epadel_user
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U epadel_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/player_padel_db
      DB_USERNAME: epadel_user
      DB_PASSWORD: test
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn clean verify

      - name: Report test failure causes
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          causes = set()
          for path in Path('target/surefire-reports').glob('*.txt'):
              text = path.read_text(errors='replace')
              matches = re.findall(r'^Caused by: (.+)$', text, re.M)
              if matches:
                  causes.add(matches[-1][:600])
          for cause in sorted(causes)[:15]:
              escaped = cause.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Test failure cause::' + escaped)
          PYCODE

      - name: Check agent instructions and pipeline automation
        run: |
          python3 -m unittest discover -s .github/bin -p 'test_*.py'
          python3 .github/bin/check-agent-migration.py
          python3 -m unittest discover -s automation/telegram-relay -p 'test_*.py'
          python3 -m unittest discover -s automation/codex-worker -p 'test_*.py'
          python3 -m unittest discover -s automation/ui-preview -p 'test_*.py'

      - name: Check isolated UI v2 environment
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/frontend/node_modules/@playwright/test/index.mjs
        run: |
          target/frontend-toolchain/node/node frontend/node_modules/@playwright/test/cli.js install chromium
          python3 automation/ui-preview/preview.py init
          python3 automation/ui-preview/preview.py config
          python3 automation/ui-preview/preview.py build
          python3 automation/ui-preview/preview.py up
          python3 automation/ui-preview/check.py

      - name: Stop isolated UI v2 environment
        if: always()
        run: |
          if [ -f automation/ui-preview/runtime/state.json ]; then
            python3 automation/ui-preview/preview.py stop
          fi

  browser-marketing:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: padel_browser_qa
          POSTGRES_USER: epadel_user
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U epadel_user -d padel_browser_qa"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_PROFILES_ACTIVE: test
      PLAYWRIGHT_MODULE_PATH: /tmp/padel-browser-qa/node_modules/playwright/index.mjs
      BROWSER_QA_DB_HOST: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install isolated browser tools
        run: npm install --prefix /tmp/padel-browser-qa --no-save --package-lock=false playwright@1.64.1
      - name: Check real browsers against isolated test server
        run: ./mvnw -Dbrowser.qa=true -Dtest=RegistrationSourceBrowserTest test
      - name: Report browser failure
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json
          report = Path('target/browser-qa/report.json')
          if report.exists():
              data = json.loads(report.read_text())
              message = data.get('error', 'Browser test failed')
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Browser QA::' + message[:1500])
          else:
              browser_log = Path('target/browser-qa/browser.log')
              if browser_log.exists():
                  for line in browser_log.read_text(errors='replace').splitlines()[-15:]:
                      escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Browser process::' + escaped[:600])
              for path in Path('target/surefire-reports').glob('*RegistrationSourceBrowserTest.txt'):
                  for line in path.read_text(errors='replace').splitlines():
                      if line.startswith('Caused by:'):
                          print('::error title=Browser server startup::' + line[:500].replace('%', '%25'))
          PYCODE
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registration-source-browser-qa
          path: |
            target/browser-qa/report.json
            target/browser-qa/*.png
          if-no-files-found: ignore
          retention-days: 3
