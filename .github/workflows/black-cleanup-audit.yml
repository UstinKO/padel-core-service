name: Разовая сверка учебных турниров клуба
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/black-cleanup-audit.yml', 'automation/black-cleanup/audit.py']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/LFPT-1260'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Передать ограниченный сценарий сверки
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          source: automation/black-cleanup/audit.py
          target: /opt/padel-app/temp/black-cleanup-1260/
          strip_components: 2
      - name: Сверить состав без изменения данных
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          command_timeout: 480s
          script_stop: true
          script: |
            set -eu
            echo BLACK_AUDIT_STARTED
            wc -c /opt/padel-app/temp/black-cleanup-1260/audit.py
            sha256sum /opt/padel-app/temp/black-cleanup-1260/audit.py
            python3 --version
            if python3 -u /opt/padel-app/temp/black-cleanup-1260/audit.py; then
              echo BLACK_AUDIT_PYTHON_OK
            else
              echo BLACK_AUDIT_PYTHON_FAILED
              exit 1
            fi
            echo BLACK_AUDIT_FINISHED
