name: Pilot 24 activation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/pilot-activation.yml']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/LFPT-1096-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authorized pilot operation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          timeout: 60s
          command_timeout: 480s
          script: |
            set -eu
            umask 077
            python3 - <<'PYPILOT'
            import json,subprocess
            from pathlib import Path
            root=Path('/opt/padel-app')
            def run(a):
             r=subprocess.run(a,capture_output=True,text=True,timeout=30)
             assert r.returncode==0
             return r.stdout
            c=json.loads(run(['docker','inspect','padel-core-app']))[0]
            env=dict(x.split('=',1) for x in c['Config']['Env'] if '=' in x)
            records={k:json.loads((root/'release-state'/(k+'.json')).read_text()) for k in ['current','previous']}
            configs={}
            for k,r in records.items():
             folder=root/'releases'/r['id']
             configs[k]=json.loads(run(['docker','compose','--project-directory',str(root),'--env-file',str(folder/'environment'),'-f',str(folder/'compose.json'),'config','--format','json']))
            a=configs['current']['services']['padel-app']['environment'];b=configs['previous']['services']['padel-app']['environment']
            print('DIAG='+json.dumps({'currentPilot':env.get('APP_RATING_PILOT_ENABLED'),'revision':env.get('APP_RELEASE_REVISION'),'currentRecord':records['current']['id'],'previousRecord':records['previous']['id'],'recordEnvironmentDiffKeys':sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k)),'currentRuntimeVsRecordedDiffKeys':sorted(k for k in set(env)|set(a) if env.get(k)!=a.get(k)),'sameImage':records['current']['image']==records['previous']['image'],'volumesSame':configs['current']['services']['padel-app'].get('volumes')==configs['previous']['services']['padel-app'].get('volumes'),'runtimeMountOrder':[m['Destination'] for m in c['Mounts']]}))
            PYPILOT
