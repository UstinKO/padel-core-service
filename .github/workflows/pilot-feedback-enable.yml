name: Verify saved rating feedback
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/pilot-feedback-enable.yml']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  enable:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/pilot-feedback-24'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify saved feedback №1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          command_timeout: 480s
          script: |
            set -eu
            python3 - <<'PYFEEDBACK'
            import json
            import subprocess

            command = ['docker', 'exec', 'padel-postgres', 'sh', '-ec',
                'exec psql -X -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"',
                'feedback-verification',
                "BEGIN READ ONLY; SELECT json_build_object('id',id,'playerId',player_id,'source',source,'mailStatus',mail_status,'testMarker',message LIKE 'ТЕСТ 1-Padel%после PR №1114.%') FROM elo_pilot_feedback_db WHERE id=1; COMMIT;"]
            result = subprocess.run(command, check=True, capture_output=True, text=True)
            record = next(json.loads(line) for line in result.stdout.splitlines() if line.startswith('{'))
            assert record == {'id': 1, 'playerId': 8, 'source': 'DASHBOARD', 'mailStatus': 'SENT', 'testMarker': True}
            print('FEEDBACK_VERIFIED=' + json.dumps(record))
            PYFEEDBACK
