name: Pilot 24 auto-refresh
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/pilot-autorefresh.yml']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/LFPT-1096-autorefresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authorized pilot operation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          timeout: 60s
          command_timeout: 480s
          script: |
            set -eu
            umask 077
            python3 - <<'PYPILOT'
            import json,subprocess,os
            from pathlib import Path
            ROOT=Path('/opt/padel-app')
            STAGE=ROOT/'.pilot-autorefresh-20261114-24'
            def run(args):
                r=subprocess.run(args,capture_output=True,text=True,timeout=90)
                if r.returncode: raise RuntimeError('Read failed: '+args[0])
                return r.stdout
            def env(c):return dict(s.split('=',1) for s in c['Config']['Env'] if '=' in s)
            def query(sql):
                data=run(['docker','exec','padel-postgres','psql','-X','-A','-t','-v','ON_ERROR_STOP=1','-U',db['POSTGRES_USER'],'-d',db['POSTGRES_DB'],'-c',"BEGIN READ ONLY; SET LOCAL statement_timeout='30s'; SELECT COALESCE(json_agg(q),'[]'::json) FROM ("+sql+") q; COMMIT;"])
                return json.loads(next(x for x in data.splitlines() if x.startswith('[')))
            os.umask(0o077)
            STAGE.mkdir(exist_ok=True,mode=0o700)
            assert not STAGE.is_symlink()
            c=json.loads(run(['docker','inspect','padel-core-app']))[0]
            e=env(c)
            assert e['APP_RATING_PILOT_ENABLED']=='true' and e['APP_RATING_PILOT_AUTO_REFRESH']=='false'
            assert e['APP_RELEASE_REVISION']=='3cb3e146a421df4adbe18cd0d5be78f8d6b6ca86'
            db=env(json.loads(run(['docker','inspect','padel-postgres']))[0])
            tournaments=query("""SELECT t.id,t.nombre,t.fecha_inicio,t.tipo,t.modalidad,t.categoria_nivel,t.estado,t.is_active,
             (SELECT count(*) FROM americano_matches_db m WHERE m.tournament_id=t.id) AS americano_matches,
             (SELECT count(*) FROM americano_matches_db m WHERE m.tournament_id=t.id AND m.status='COMPLETED') AS completed_americano,
             (SELECT count(*) FROM king_of_court_match_result_db m JOIN king_of_court_court_db c ON c.id=m.court_id JOIN king_of_court_round_db r ON r.id=c.round_id JOIN tournament_king_of_court_db k ON k.id=r.tournament_king_id WHERE k.tournament_id=t.id) AS king_results
             FROM tournaments_db t WHERE t.fecha_inicio > DATE '2026-11-12' ORDER BY t.fecha_inicio,t.id""")
            scores=query("\n            SELECT t.id AS event_id, t.nombre AS event_title, t.fecha_inicio, t.categoria_nivel, 'king' AS format,\n                   k.id AS game_tournament, k.is_finished AS finished, NULL AS final_order,\n                   m.id AS match_id, r.round_number AS batch, false AS final_match,\n                   m.winners_score AS left_score, m.losers_score AS right_score,\n                   m.winner1_id AS a, m.winner2_id AS b, m.loser1_id AS c, m.loser2_id AS d,\n                   NULL::bigint AS qualification_id\n              FROM king_of_court_match_result_db m\n              JOIN king_of_court_court_db c ON c.id=m.court_id\n              JOIN king_of_court_round_db r ON r.id=c.round_id\n              JOIN tournament_king_of_court_db k ON k.id=r.tournament_king_id\n              JOIN tournaments_db t ON t.id=k.tournament_id\n             WHERE (t.fecha_inicio > DATE '2026-11-12' OR t.id IN (-1))\n               AND t.is_active AND t.estado <> 'CANCELADO' AND r.is_completed\n             UNION ALL\n            SELECT t.id, t.nombre, t.fecha_inicio, t.categoria_nivel,\n                   CASE WHEN t.tipo='AMERICANO_TEAMS' THEN 'pair' ELSE 'americano' END,\n                   t.id, t.estado='FINALIZADO', t.americano_final_order, m.id,\n                   CASE WHEN t.tipo='AMERICANO_TEAMS' THEN\n                       CASE m.playoff_stage WHEN 'ROUND_OF_16' THEN 3 WHEN 'QUARTER_FINAL' THEN 4\n                           WHEN 'SEMI_FINAL' THEN 5 WHEN 'FINAL' THEN 6\n                           ELSE LEAST(r.round_number, 2) END\n                       ELSE r.round_number END,\n                   COALESCE(t.tipo='AMERICANO_TEAMS' AND m.playoff_stage='FINAL',false),\n                   CASE WHEN t.tipo='AMERICANO_TEAMS' THEN m.team1_games ELSE m.team1_score END,\n                   CASE WHEN t.tipo='AMERICANO_TEAMS' THEN m.team2_games ELSE m.team2_score END,\n                   m.team1_player1_id,m.team1_player2_id,m.team2_player1_id,m.team2_player2_id,\n                   CASE WHEN t.tipo='AMERICANO_TEAMS' AND r.phase='QUALIFICATION' AND m.playoff_stage IS NULL\n                       THEN m.id END\n              FROM americano_matches_db m\n              JOIN americano_rounds_db r ON r.id=m.round_id\n              JOIN tournaments_db t ON t.id=m.tournament_id\n             WHERE (t.fecha_inicio > DATE '2026-11-12' OR t.id IN (-1))\n               AND t.is_active AND t.estado <> 'CANCELADO' AND m.status='COMPLETED'\n               AND ((t.tipo='AMERICANO' AND t.modalidad='INDIVIDUAL' AND r.status='COMPLETED')\n                    OR (t.tipo='AMERICANO_TEAMS' AND t.modalidad='DOBLES' AND m.team1_games IS NOT NULL\n                        AND m.team2_games IS NOT NULL))\n             ORDER BY fecha_inicio,event_id,batch,match_id\n            ")
            source=json.loads((ROOT/'rating-pilot/2026-11-13-pilot24-5e97a1b/rating-source.json').read_text())
            report={'pilotEnabled':True,'autoRefresh':False,'tournaments':tournaments,'scoredRows':scores,'excludedEvents':source['excludedEvents'],'liveAfter':source['liveAfter']}
            (STAGE/'audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
            print('FRESH_MATCH_AUDIT='+json.dumps(report,ensure_ascii=False))
            PYPILOT
