name: Pilot 24 auto-refresh
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/pilot-autorefresh.yml']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/LFPT-1096-autorefresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authorized pilot operation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          timeout: 60s
          command_timeout: 480s
          script: |
            set -eu
            umask 077
            python3 - <<'PYPILOT'
            import fcntl,json,shutil,subprocess
            from pathlib import Path
            root=Path('/opt/padel-app');stage=root/'.pilot-autorefresh-20261114-24'
            with (root/'release-state/lock').open('a') as lock:
             fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
             report=json.loads((stage/'enabled.json').read_text())
             current=json.loads((root/'release-state/current.json').read_text())
             assert current['id']==report['recordId']
             c=json.loads(subprocess.check_output(['docker','inspect','padel-core-app']))[0]
             env=dict(x.split('=',1) for x in c['Config']['Env'] if '=' in x)
             assert c['State']['Running'] and env['APP_RATING_PILOT_ENABLED']=='true' and env['APP_RATING_PILOT_AUTO_REFRESH']=='true'
             p=stage/'probe';assert not stage.is_symlink() and not p.is_symlink()
             if p.exists():shutil.rmtree(p)
             print('PILOT_CLEANUP='+json.dumps({'temporaryProbeRemoved':not p.exists(),'pilotEnabled':True,'autoRefresh':True,'running':True,'frozenReleaseRetained':(stage/'frozen-release.json').is_file()}))
            PYPILOT
