name: Pilot 24 auto-refresh
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/pilot-autorefresh.yml']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/LFPT-1096-autorefresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authorized pilot operation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          timeout: 60s
          command_timeout: 480s
          script: |
            set -eu
            umask 077
            python3 - <<'PYPILOT'
            import base64,copy,fcntl,hashlib,json,os,subprocess,sys,tempfile,zipfile
            from pathlib import Path
            
            ROOT=Path('/opt/padel-app')
            STAGE=ROOT/'.pilot-autorefresh-20261114-24'
            REVISION='3cb3e146a421df4adbe18cd0d5be78f8d6b6ca86'
            VERSION='2026-11-13-pilot24-5e97a1b'
            IDS={208,226,234,137,8,272,600,621,320,119,169,232,411,211,127,522,65,168,701,198,186,301,263,192}
            HASHES={'pilot-snapshot.json':'6c70f3de9846b8eb4f12478f0bfe1391ecbd8f936c67ca2716b4e0c4154c7a89','rating-source.json':'4a4287e4cda6bcef4eb01807f71c8a156de2353d6c2cec3c21498f25cc96e17d'}
            PHASE='activate'
            CHECK_CLASS=''
            
            def run(args,timeout=90):
                r=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
                if r.returncode:raise RuntimeError('Operation failed: '+args[0])
                return r.stdout
            
            def inspect():return json.loads(run(['docker','inspect','padel-core-app']))[0]
            def environment(c):return dict(x.split('=',1) for x in c['Config']['Env'] if '=' in x)
            def digest(path):return hashlib.sha256(path.read_bytes()).hexdigest()
            
            def protected_report(name,value):
                path=STAGE/name
                path.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n');path.chmod(0o600)
            
            def files_and_config(c,auto_refresh):
                env=environment(c)
                assert env['APP_RELEASE_REVISION']==REVISION
                assert env['APP_RATING_PILOT_ENABLED']=='true'
                assert env['APP_RATING_PILOT_AUTO_REFRESH']==auto_refresh
                assert env.get('APP_SPA_ROUTES','')==''
                assert set(map(int,env['APP_RATING_PILOT_PLAYER_IDS'].split(',')))==IDS
                assert env['APP_RATING_PILOT_SNAPSHOT']=='/app/rating-pilot/'+VERSION+'/pilot-snapshot.json'
                assert env['APP_RATING_PILOT_HISTORY']=='/app/rating-pilot/'+VERSION+'/rating-source.json'
                mounts=[m for m in c['Mounts'] if m['Destination']=='/app/rating-pilot']
                assert len(mounts)==1 and not mounts[0]['RW'] and mounts[0]['Source']==str(ROOT/'rating-pilot')
                for name,sha in HASHES.items():assert digest(ROOT/'rating-pilot'/VERSION/name)==sha
                assert c['State']['Running']
                return env
            
            def access_probe(c,jar):
                probe=STAGE/'probe';probe.mkdir(exist_ok=True,mode=0o755);probe.chmod(0o755)
                with zipfile.ZipFile(jar) as archive:
                    for member in archive.infolist():
                        if not member.filename.startswith(('BOOT-INF/classes/','BOOT-INF/lib/')) or member.is_dir():continue
                        relative=Path(member.filename)
                        assert not relative.is_absolute() and '..' not in relative.parts
                        path=probe/relative;path.parent.mkdir(parents=True,exist_ok=True)
                        path.write_bytes(archive.read(member));path.chmod(0o644)
                for path in probe.rglob('*'):
                    if path.is_dir():path.chmod(0o755)
                classes=probe/'checks';classes.mkdir(exist_ok=True);classes.chmod(0o755)
                (classes/'PilotAccessCheck.class').write_bytes(base64.b64decode(CHECK_CLASS));(classes/'PilotAccessCheck.class').chmod(0o644)
                env=environment(c)
                settings={k:env[k] for k in ['APP_RATING_PILOT_ENABLED','APP_RATING_PILOT_PLAYER_IDS','APP_RATING_PILOT_SNAPSHOT','APP_SPA_ROUTES']}
                settings['APP_RATING_PILOT_ENABLED']='true'
                (probe/'settings.json').write_text(json.dumps(settings));(probe/'settings.json').chmod(0o644)
                db=json.loads(run(['docker','inspect','padel-postgres']))[0]
                db_env=environment(db)
                account_ids=run(['docker','exec','padel-postgres','psql','-X','-A','-t','-U',db_env['POSTGRES_USER'],'-d',db_env['POSTGRES_DB'],'-c','SELECT id FROM player_padel_db ORDER BY id'])
                assert all(x.isdigit() for x in account_ids.splitlines() if x)
                (probe/'accounts.txt').write_text(account_ids);(probe/'accounts.txt').chmod(0o644)
                output=run(['docker','run','--rm','--network','none','--read-only','--memory','384m','--cpus','1','--cap-drop','ALL','--security-opt','no-new-privileges','--mount','type=bind,src='+str(probe)+',dst=/probe,readonly','--mount','type=bind,src='+str(ROOT/'rating-pilot')+',dst=/app/rating-pilot,readonly','--entrypoint','java',c['Image'],'-Xmx192m','-cp','/probe/checks:/probe/BOOT-INF/classes:/probe/BOOT-INF/lib/*','PilotAccessCheck','/probe/settings.json','/probe/accounts.txt'])
                lines=[s for s in output.splitlines() if s.startswith('ACCESS_MATRIX=')]
                assert len(lines)==1
                result=json.loads(lines[0].split('=',1)[1]);assert result['allowedAccounts']==28 and result['canonicalPlayers']==24
                return result
            
            def refresh_probe(c):
                probe=STAGE/'probe'
                java_class=probe/'checks/com/padle/core/padelcoreservice/preview/PilotRefreshCheck.class'
                java_class.parent.mkdir(parents=True,exist_ok=True)
                for folder in [java_class.parent,*java_class.parent.parents]:
                    if folder==probe:break
                    folder.chmod(0o755)
                java_class.write_bytes(base64.b64decode(''));java_class.chmod(0o644)
                env=environment(c)
                settings={k:env[k] for k in ['APP_RATING_PILOT_PLAYER_IDS','APP_RATING_PILOT_SNAPSHOT','APP_RATING_PILOT_HISTORY']}
                (probe/'refresh-settings.json').write_text(json.dumps(settings));(probe/'refresh-settings.json').chmod(0o644)
                credential_file=probe/'database-read.json'
                credential_file.write_text(json.dumps({k:env[k] for k in ['DB_URL','DB_USERNAME','DB_PASSWORD']}));credential_file.chmod(0o644)
                network_names=list(c['NetworkSettings']['Networks'])
                assert len(network_names)==1
                try:
                    output=run(['docker','run','--rm','--network',network_names[0],'--read-only','--memory','384m','--cpus','1','--cap-drop','ALL','--security-opt','no-new-privileges','--mount','type=bind,src='+str(probe)+',dst=/probe,readonly','--mount','type=bind,src='+str(ROOT/'rating-pilot')+',dst=/app/rating-pilot,readonly','--entrypoint','java',c['Image'],'-Xmx192m','-cp','/probe/checks:/probe/BOOT-INF/classes:/probe/BOOT-INF/lib/*','com.padle.core.padelcoreservice.preview.PilotRefreshCheck','/probe/refresh-settings.json','/probe/database-read.json'])
                finally:
                    credential_file.unlink(missing_ok=True)
                lines=[line for line in output.splitlines() if line.startswith('REFRESH_CHECK=')]
                assert len(lines)==1
                report=json.loads(lines[0].split('=',1)[1])
                assert report['allRowsEqual'] and report['pilotPlayers']==24 and report['readOnly'] and report['liveEventsAdded']==0
                return report
            
            def main():
                os.umask(0o077)
                STAGE.mkdir(exist_ok=True,mode=0o700)
                assert not STAGE.is_symlink()
                with tempfile.TemporaryDirectory(dir=STAGE) as modules:
                    runner=ROOT/'temp/release-runner.pyz'
                    assert runner.is_file() and not runner.is_symlink()
                    with zipfile.ZipFile(runner) as archive:
                        for name in ['artifact.py','docker_adapter.py','smoke.py','transaction.py','production.py']:
                            (Path(modules)/name).write_bytes(archive.read(name))
                    sys.path.insert(0,modules)
                    from production import Production
                    from transaction import Releases,install_signals
                    install_signals()
                    current=json.loads((ROOT/'release-state/current.json').read_text())
                    assert current['revision']==REVISION
                    current_folder=ROOT/'releases'/current['id']
                    config=json.loads(run(['docker','compose','--project-directory',str(ROOT),'--env-file',str(current_folder/'environment'),'-f',str(current_folder/'compose.json'),'config','--format','json']))
                    class PilotProduction(Production):
                        def smoke(self,record):
                            super().smoke(record)
                            expected=json.loads((self.folder(record)/'compose.json').read_text())['services']['padel-app']['environment']['APP_RATING_PILOT_AUTO_REFRESH']
                            files_and_config(inspect(),expected)
                            for path in ['/','/login','/ranking','/players/dashboard?playerId=8']:
                                response=self.fetch(record)(path)
                                assert response.status in (200,302)
                                assert b'elo-cabinet' not in response.body and b'/css/elo-preview.css' not in response.body
                    adapter=PilotProduction(ROOT,ROOT/'releases',config['name'],'padel-app')
                    releases=Releases(ROOT/'release-state',adapter)
                    with releases.locked():
                        assert not releases.read('pending')
                        assert releases.read('current')==current
                        c=inspect();env=files_and_config(c,'false')
                        adapter.validate(current)
                        assert digest(ROOT/'.env')==current['environmentSha256']
                        assert env==config['services']['padel-app']['environment'] or all(env.get(k)==str(v) for k,v in config['services']['padel-app']['environment'].items())
                        access=access_probe(c,current_folder/'app.jar')
                        comparison_before=refresh_probe(c)
                        protected_report('comparison-before.json',comparison_before)
                        protected_report('preflight.json',{'recordId':current['id'],'revision':REVISION,'access':access,'files':HASHES})
                        text=(current_folder/'environment').read_text()
                        lines=text.splitlines(keepends=True)
                        matched=[i for i,line in enumerate(lines) if line.startswith('APP_RATING_PILOT_AUTO_REFRESH=')]
                        assert len(matched)==1 and lines[matched[0]].strip()=='APP_RATING_PILOT_AUTO_REFRESH=false'
                        lines[matched[0]]='APP_RATING_PILOT_AUTO_REFRESH=true\n'
                        candidate_config=copy.deepcopy(config)
                        candidate_config['services']['padel-app']['environment']['APP_RATING_PILOT_AUTO_REFRESH']='true'
                        manifest=json.loads((current_folder/'manifest.json').read_text())
                        candidate=adapter.prepare(current_folder/'app.jar',manifest,current['image'],candidate_config,''.join(lines).encode())
                        assert candidate['image']==current['image']
                        protected_report('frozen-release.json',current)
                        releases._deploy_locked(candidate)
                        try:
                            active=inspect();actual=files_and_config(active,'true')
                            assert active['Image']==c['Image']
                            assert {k:v for k,v in actual.items() if k!='APP_RATING_PILOT_AUTO_REFRESH'}=={k:v for k,v in env.items() if k!='APP_RATING_PILOT_AUTO_REFRESH'}
                            assert sorted(active['Mounts'],key=lambda m:m['Destination'])==sorted(c['Mounts'],key=lambda m:m['Destination'])
                            assert digest(ROOT/'.env')==candidate['environmentSha256']
                            assert releases.read('current')==candidate and releases.read('previous')==current
                            verified_access=access_probe(active,adapter.folder(candidate)/'app.jar')
                            comparison_after=refresh_probe(active)
                            assert comparison_before==comparison_after
                            protected_report('comparison-after.json',comparison_after)
                            report={'revision':REVISION,'pilotEnabled':True,'autoRefresh':True,'sameApplicationImage':True,'onlyAutoRefreshFlagChanged':True,'mountsUnchanged':True,'filesVerified':True,'databaseRatingWrites':False,'readinessVerified':True,'anonymousKeepsLegacy':True,'frozenReleaseRetained':True,'comparison':comparison_after,'access':verified_access,'recordId':candidate['id']}
                            protected_report('enabled.json',report)
                            print('AUTO_REFRESH_ENABLED='+json.dumps(report))
                        except BaseException:
                            releases._deploy_locked(current)
                            raise
            
            if __name__=='__main__':
                try:main()
                except BaseException as error:
                    import traceback
                    print('PILOT_OPERATION_ERROR='+type(error).__name__+' '+','.join(str(f.lineno) for f in traceback.extract_tb(error.__traceback__)))
                    raise SystemExit(1)
            PYPILOT
