name: Pilot server read-only audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/pilot-server-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/LFPT-1096'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read pilot settings without deploying
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          timeout: 60s
          command_timeout: 120s
          script: |
            set -eu
            python3 - <<'PYREADONLY'
            """Read-only production preflight. Prints only explicitly allowed, nonsecret fields."""
            import hashlib
            import json
            from pathlib import Path
            import re
            import subprocess
            
            ROOT = Path('/opt/padel-app')
            VERSION = '2026-11-13-pilot24-5e97a1b'
            
            def command(args):
                result = subprocess.run(args, capture_output=True, text=True, timeout=45)
                if result.returncode:
                    raise RuntimeError('Read-only command failed: '+args[0])
                return result.stdout
            
            def inspect():
                return json.loads(command(['docker', 'inspect', 'padel-core-app']))[0]
            
            def settings(env):
                ids = env.get('APP_RATING_PILOT_PLAYER_IDS', '') or ''
                return {
                    'enabled': str(env.get('APP_RATING_PILOT_ENABLED', 'unset')).lower(),
                    'autoRefresh': str(env.get('APP_RATING_PILOT_AUTO_REFRESH', 'unset')).lower(),
                    'playerIdsCount': len([x for x in str(ids).split(',') if x.strip()]),
                    'spaRoutesEmpty': env.get('APP_SPA_ROUTES', '') in ('', '[]', None),
                    'snapshotPathConfigured': bool(env.get('APP_RATING_PILOT_SNAPSHOT')),
                    'historyPathConfigured': bool(env.get('APP_RATING_PILOT_HISTORY')),
                    'otherSpringConfigPresent': any(env.get(k) for k in ['SPRING_APPLICATION_JSON', 'SPRING_CONFIG_LOCATION', 'SPRING_CONFIG_ADDITIONAL_LOCATION', 'JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS'])
                }
            
            def main():
                before = inspect()
                config = json.loads(command(['docker', 'compose', '--project-directory', str(ROOT), '--env-file', str(ROOT/'.env'), '-f', str(ROOT/'docker-compose.yml'), 'config', '--format', 'json']))
                runtime_env = dict(x.split('=', 1) for x in before['Config']['Env'] if '=' in x)
                configured = config['services']['padel-app']
                runtime_mounts = [m for m in before['Mounts'] if m['Destination'] == '/app/rating-pilot']
                configured_mounts = [m for m in configured.get('volumes', []) if m.get('target') == '/app/rating-pilot']
                files = {}
                for name in ['pilot-snapshot.json', 'rating-source.json']:
                    host_path = ROOT/'rating-pilot'/VERSION/name
                    readable = subprocess.run(['docker', 'exec', 'padel-core-app', 'test', '-r', f'/app/rating-pilot/{VERSION}/{name}'], capture_output=True, timeout=20).returncode == 0
                    files[name] = {'existsOnHost': host_path.is_file(), 'readableInRunningContainer': readable}
                    if host_path.is_file():
                        files[name]['sha256'] = hashlib.sha256(host_path.read_bytes()).hexdigest()
                version_file = ROOT/'version.txt'
                revision = version_file.read_text().splitlines()[0] if version_file.is_file() else ''
                after = inspect()
                report = {
                    'mode': 'read_only', 'serverMutations': False,
                    'running': before['State']['Running'],
                    'containerUnchanged': before['Id'] == after['Id'] and before['State']['StartedAt'] == after['State']['StartedAt'],
                    'runtime': settings(runtime_env), 'configured': settings(configured.get('environment', {})),
                    'runtimeMountPresent': bool(runtime_mounts), 'runtimeMountReadOnly': bool(runtime_mounts) and not any(m['RW'] for m in runtime_mounts),
                    'configuredMountPresent': bool(configured_mounts), 'configuredMountReadOnly': bool(configured_mounts) and all(m.get('read_only') for m in configured_mounts),
                    'releaseFiles': files,
                    'releaseStatePresent': (ROOT/'release-state'/'current.json').is_file(),
                    'currentRevision': revision if re.fullmatch('[0-9a-f]{40}', revision) else 'unavailable'
                }
                for group in ['runtime', 'configured']:
                    for key in ['enabled', 'autoRefresh']:
                        if report[group][key] not in ['unset', 'true', 'false', '1', '0', 'yes', 'no', 'on', 'off']:
                            report[group][key] = 'nonstandard_value'
                print('PILOT_SERVER_AUDIT='+json.dumps(report, sort_keys=True))
            
            if __name__ == '__main__':
                try:
                    main()
                except Exception as error:
                    print('PILOT_SERVER_AUDIT_ERROR='+type(error).__name__)
                    raise SystemExit(1)
            PYREADONLY
