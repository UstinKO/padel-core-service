name: Проверка запуска общего Elo
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/elo-public-activation.yml']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/rating-public-launch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверка условий запуска Elo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          timeout: 60s
          command_timeout: 480s
          script: |
            set -eu
            umask 077
            python3 - <<'PYRUN'
            import base64
            exec(compile(base64.b64decode(''), '<elo-public-operation>', 'exec'))
            PYRUN
