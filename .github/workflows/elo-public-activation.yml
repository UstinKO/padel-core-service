name: Проверка запуска общего Elo
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/elo-public-activation.yml']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'UstinKO/padel-core-service' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/rating-public-launch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверка условий запуска Elo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_NEW }}
          timeout: 60s
          command_timeout: 480s
          script: |
            set -eu
            umask 077
            python3 - <<'PYRUN'
            import copy,hashlib,json,os,subprocess,sys,tempfile,zipfile,re
            from datetime import datetime, date
            from pathlib import Path
            ROOT=Path('/opt/padel-app')
            EXPECTED_REVISION='66a4a0aa038a1aee595018ff7ba882a0e385a9ea'
            PHASE='preflight'
            def run(cmd):
             return subprocess.run(cmd,check=True,capture_output=True,timeout=180).stdout.decode()
            def digest(path):
             return hashlib.sha256(path.read_bytes()).hexdigest()
            with tempfile.TemporaryDirectory(prefix='elo-public-check-') as modules:
             runner=ROOT/'temp/release-runner.pyz'
             if not runner.is_file() or runner.is_symlink():raise RuntimeError('missing runner')
             with zipfile.ZipFile(runner) as z:
              for name in ['artifact.py','docker_adapter.py','smoke.py','transaction.py','production.py']:(Path(modules)/name).write_bytes(z.read(name))
             sys.path.insert(0,modules)
             from production import Production
             from transaction import Releases,install_signals
             install_signals()
             current=json.loads((ROOT/'release-state/current.json').read_text())
             if current['revision']!=EXPECTED_REVISION:raise RuntimeError('revision changed')
             folder=ROOT/'releases'/current['id']
             config=json.loads(run(['docker','compose','--project-directory',str(ROOT),'--env-file',str(folder/'environment'),'-f',str(folder/'compose.json'),'config','--format','json']))
             class PublicProduction(Production):
              def smoke(self,record):
               super().smoke(record)
               env=json.loads((self.folder(record)/'compose.json').read_text())['services']['padel-app']['environment']
               if env.get('APP_RATING_PILOT_ALL_PLAYERS')=='true':
                if env.get('APP_RATING_PILOT_FORMAT_WEIGHTED')!='true' or env.get('APP_RATING_PILOT_AUTO_REFRESH')!='true':raise RuntimeError('incorrect formula or refresh flag')
                for language,needle in [('ru','Как работает рейтинг'),('es','Cómo funciona el ranking'),('en','How the ranking works')]:
                 response=self.fetch(record)('/ranking?lang='+language)
                 if response.status!=200 or b'elo-leaderboard' not in response.body or needle.encode() not in response.body:raise RuntimeError('public ranking smoke failed')
                 if b'data-feedback-open' in response.body:raise RuntimeError('visitor feedback form visible')
                 if len(re.findall(b'data-player-id=',response.body))<350:raise RuntimeError('ranking missing players')
                 if language=='ru':
                  match=re.search('Результаты учтены по ([0-9]{2}/[0-9]{2}/[0-9]{4})',response.body.decode())
                  if not match or datetime.strptime(match.group(1),'%d/%m/%Y').date()<date(2026,11,15):raise RuntimeError('fresh matches missing')
             adapter=PublicProduction(ROOT,ROOT/'releases',config['name'],'padel-app')
             releases=Releases(ROOT/'release-state',adapter)
             with releases.locked():
              if releases.read('pending') or releases.read('current')!=current:raise RuntimeError('release changed')
              adapter.validate(current)
              if digest(ROOT/'.env')!=current['environmentSha256']:raise RuntimeError('environment changed')
              service=config['services']['padel-app']; env=service['environment']
              if env.get('APP_RATING_PILOT_ENABLED')!='true' or env.get('APP_RATING_PILOT_AUTO_REFRESH')!='true':raise RuntimeError('pilot or refresh disabled')
              if env.get('APP_RATING_PILOT_FEEDBACK_ENABLED')!='true':raise RuntimeError('feedback disabled')
              if env.get('APP_RATING_PILOT_ALL_PLAYERS','false')!='false' or env.get('APP_RATING_PILOT_FORMAT_WEIGHTED','false')!='false':raise RuntimeError('flags already changed')
              if PHASE=='preflight':
               adapter.smoke(current)
               print('PUBLIC_ELO_PREFLIGHT_OK='+json.dumps({'revision':EXPECTED_REVISION,'pilotEnabled':True,'autoRefresh':True,'feedbackEnabled':True,'flagsDisabled':True}))
               sys.exit(0)
              candidate_config=copy.deepcopy(config)
              changes={'APP_RATING_PILOT_ALL_PLAYERS':'true','APP_RATING_PILOT_FORMAT_WEIGHTED':'true'}
              candidate_config['services']['padel-app']['environment'].update(changes)
              lines=(folder/'environment').read_text().splitlines()
              for key,value in changes.items():
               hits=[i for i,line in enumerate(lines) if line.startswith(key+'=')]
               if len(hits)>1:raise RuntimeError('duplicate setting')
               if hits: lines[hits[0]]=key+'='+value
               else: lines.append(key+'='+value)
              manifest=json.loads((folder/'manifest.json').read_text())
              candidate=adapter.prepare(folder/'app.jar',manifest,current['image'],candidate_config,('\n'.join(lines)+'\n').encode())
              if candidate['image']!=current['image']:raise RuntimeError('unexpected image')
              releases._deploy_locked(candidate)
              try:
               actual=adapter.container()
               if actual['Image']!=current['image'] or releases.read('previous')!=current:raise RuntimeError('post-check failed')
              except BaseException:
               releases._deploy_locked(current)
               raise
              print('PUBLIC_ELO_RELEASE_OK='+json.dumps({'revision':EXPECTED_REVISION,'record':candidate['id'],'publicRanking':True,'formatWeighted':True,'autoRefresh':True,'feedbackForPlayers':True,'languages':['ru','es','en'],'rollbackAvailable':True}))
            PYRUN
